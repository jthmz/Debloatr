    if (state.status === 'error') return [head, errorCard()];

    const lists = state.scan.lists;
    const history = state.scan.history;
    const items = cleanup();
    const apps = items.filter(r => r.app);
    const system = items.filter(r => !r.app);

    // The outcome first, then the one thing to do about it.
    const what = [
      apps.length ? `${plural(apps.length, 'app', 'apps')} that an installer pushed onto it` : '',
      system.length ? `${plural(system.length, 'preinstalled app', 'preinstalled apps')} the rules mark safe to remove` : '',
    ].filter(Boolean).join(' and ');
    const hero = el('section', { class: `card hero${magic ? ' staged' : ''}` },
      el('div', { class: 'hero-main' }, el('div', {},
        el('div', { class: 'hero-status' },
          el('span', { class: `dot ${items.length ? 'warn' : 'ok'}` }),
          items.length ? 'Cleanup available' : 'Clean by the rules',
          history.length ? `, scanned ${at(history[history.length - 1].time)}` : ''),
        el('div', { class: 'hero-number' },
          items.length ? `${plural(items.length, 'app', 'apps')} on this phone can go`
            : 'Nothing the rules know about is left to remove'),
        el('p', {},
          items.length ? `${what.charAt(0).toUpperCase()}${what.slice(1)}.`
            : 'The sponsored-app installers, lock screen feeds and promos the rules cover are gone, or were never here.',
          lists.back.length ? ` ${lists.back.length} came back after being removed.` : '',
          lists.ask.length ? ` ${plural(lists.ask.length, 'more needs', 'more need')} a look first, under Ask first.` : '')),
      el('div', { class: 'hero-actions' },
        items.length
          ? [magic ? el('button', { class: 'btn primary', 'data-wizard': true, onclick: openWizard }, icon('wand'), 'Clean up with the wizard') : null,
            el('button', { class: magic ? 'btn' : 'btn primary', onclick: review }, icon('review'), magic ? 'Review as a list' : 'Review cleanup')]
          : [lists.ask.length ? el('button', { class: 'btn primary', onclick: () => openDeck() }, icon('layers'), `Go through ${lists.ask.length} more`) : null,
            el('button', { class: lists.ask.length ? 'btn' : 'btn primary', onclick: () => scan() }, icon('refresh'), 'Scan again')],
        state.needsRestart
          ? [el('button', { class: 'btn', onclick: restart }, icon('power'), 'Restart phone'),
            el('span', { class: 'hint' }, 'so the lock and home screens catch up')]
          : null)),
      stage());

    return [head, hero, tiles(), el('div', { class: 'split' }, checksCard(), changesCard())];
  }

  // Three numbers, each with how it moved since the scan before and its trend.
  function tiles() {
    const history = state.scan.history;
    const now = history[history.length - 1] || { cleanup: 0, installed: 0, off: 0 };
    const before = history.length > 1 ? history[history.length - 2] : null;
    const tile = (label, iconName, key, lowerIsBetter) => {
      const value = el('div', { class: 'tile-value' });
      countUp(value, now[key], !state.counted);
      let delta = null;
      let caption = 'first scan, nothing to compare yet';
      if (before) {
        const diff = now[key] - before[key];
        const pct = before[key] ? Math.round(Math.abs(diff) / before[key] * 100) : null;
        const tone = diff === 0 || lowerIsBetter == null ? '' : ((diff < 0) === lowerIsBetter ? ' good' : ' bad');
        delta = el('span', { class: `delta${tone}` },
          icon(diff === 0 ? 'flat' : diff < 0 ? 'down' : 'up', 12),
          diff === 0 ? '0%' : pct == null ? 'new' : `${pct}%`);
        caption = `was ${before[key]} at ${at(before.time)}`;
      }
      return el('section', { class: 'card tile' },
        el('div', { class: 'tile-label' }, icon(iconName), label),
        el('div', { class: 'tile-main' }, value, sparkline(history.map(h => h[key]))),
        el('div', { class: 'tile-foot' }, delta, el('span', {}, caption)));
    };
    return el('div', { class: 'tiles' },
      tile('To clean up', 'trash', 'cleanup', true),
      tile('Apps on the phone', 'box', 'installed', true),
      tile('Off or removed', 'off', 'off', null));
  }

  // A plain line, no fill: the shape of the last scans, newest at the right.
  function sparkline(values) {
    const w = 96;
    const h = 28;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    for (const [k, v] of Object.entries({ viewBox: `0 0 ${w} ${h}`, width: w, height: h, class: 'spark', 'aria-hidden': 'true' })) {
      svg.setAttribute(k, v);
    }
    const points = values.slice(-24);
    if (points.length === 0) return svg;
    if (points.length === 1) points.unshift(points[0]);
    const min = Math.min(...points);
    const max = Math.max(...points);
    const xy = points.map((v, i) => [
      2 + i * (w - 4) / (points.length - 1),
      max === min ? h / 2 : 3 + (h - 6) * (1 - (v - min) / (max - min)),
    ]);
    const line = xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const [lx, ly] = xy[xy.length - 1];
    svg.innerHTML = `<polyline points="${line}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2" fill="currentColor"/>`;
    return svg;
  }

  // The state of the phone as a short list: what is wrong, what is fine,
  // and beside each thing that is wrong the one thing to do about it.
  function checksCard() {
    const lists = state.scan.lists;
    const installers = state.scan.installers || [];
    const active = installers.filter(item => item.active);
    const listed = Number(state.scan.meta.community) || 0;
    const names = [...new Set(active.map(item => Words.vendorOf(item.pkg) || Words.readable(item.pkg)))].join(', ');
    const check = (tone, title, detail, action) => el('div', { class: 'check' },
      el('span', { class: `check-mark ${tone}` }, icon({ ok: 'check', bad: 'alert', warn: 'alert', note: 'help' }[tone], 16)),
      el('div', { class: 'check-text' }, el('div', {}, title), detail ? el('div', { class: 'check-detail' }, detail) : null),
      action || el('span', {}));
    const button = (label, run, iconName) => el('button', { class: 'btn small', onclick: run, disabled: state.pending.size > 0 },
      iconName ? icon(iconName, 12) : null, label);
    const out = [];

    if (active.length) {
      out.push(check('bad', `${plural(active.length, 'installer', 'installers')} can still put apps back`,
        `${names}. Until ${active.length === 1 ? 'it goes' : 'they go'}, what you remove can return.`,
        button('Clean up', magic ? openWizard : review)));
    } else if (installers.length) {
      out.push(check('ok', 'Nothing can put apps back',
        `${plural(installers.length, 'sponsored-app installer was', 'sponsored-app installers were')} on this phone, and ${installers.length === 1 ? 'is' : 'are'} out of the way.`));
    } else {
      out.push(check('ok', 'No sponsored-app installer here', 'Nothing on this phone installs apps behind your back, as far as the rules know.'));
    }
    if (lists.back.length) {
      out.push(check('bad', `${plural(lists.back.length, 'removed app is', 'removed apps are')} back`,
        'An installer or a system update brought it back.', button('See', () => go('back'))));
    } else if (state.scan.changes.length) {
      out.push(check('ok', 'Nothing you removed has come back'));
    }
    if (state.needsRestart) {
      out.push(check('warn', 'The phone wants a restart', 'So that its lock and home screens catch up.', button('Restart', restart, 'power')));
    }
    if (lists.ask.length) {
      out.push(check('note', `${plural(lists.ask.length, 'app needs', 'apps need')} a look first`,
        'Each has a catch. Go through them one at a time.', button('One at a time', () => openDeck(), 'layers')));
    }
    if (lists.unknown.length) {
      out.push(check('note', `${plural(lists.unknown.length, 'preinstalled app', 'preinstalled apps')} no rule covers`,
        listed ? 'The community list is in use, and says what it can about them.' : 'The community list knows most apps on most phones.',
        listed ? button('See', () => go('unknown')) : button('Get the list', () => community(true), 'users')));
    }
    if (lists.notifying.length) {
      out.push(check('note', `${plural(lists.notifying.length, 'app has', 'apps have')} a notification up`,
        'As of the last scan.', button('See', () => go('notifying'))));
    }
    return el('section', { class: 'card' }, el('div', { class: 'card-head' }, el('h2', {}, 'Checks')), out);
  }

  // The community list: fetch it, or stop using it, and scan again either
  // way. It is one download, from the project that keeps the list.
  async function community(on) {
    toast(on ? 'Fetching the community list.' : 'Dropping the community list.');
    const result = await api('/api/community', { method: 'POST', body: { on } });
    log(on ? 'Get the community list' : 'Stop using the community list', result.output || result.error);
    if (!result.ok) return toast(result.error, { tone: 'bad' });
    await scan({ quiet: true });
    const n = Number(state.scan && state.scan.meta.community) || 0;
    return toast(on ? `The community list is in use: ${n} apps described. What it recommends removing is under Ask first.`
      : 'The community list is no longer used.', { undo: on ? () => community(false) : null });
  }

  function changesCard() {
    const changes = state.scan.changes.slice().reverse().slice(0, 6);
    const card = el('section', { class: 'card' },
      el('div', { class: 'card-head' }, el('h2', {}, 'Recent changes')));
    if (!changes.length) {
      card.append(el('div', { class: 'state compact' },
        icon('restore', 32),
        el('strong', {}, 'Whatever you remove or silence is listed here, with a way back.'),
        cleanup().length
          ? el('button', { class: 'btn', onclick: magic ? () => openWizard() : review }, icon(magic ? 'wand' : 'review'), magic ? 'Clean up with the wizard' : 'Review cleanup')
          : null));
      return card;
    }
    for (const change of changes) {
      const gone = change.action === 'uninstalled';
      card.append(el('div', { class: `change-row${state.pending.has(change.pkg) ? ' pending' : ''}` },
        el('div', {},
          pkgNode(change.pkg),
          el('div', { class: 'when' }, [DID[change.action] || change.action, ago(change.when)].filter(Boolean).join(', '))),
        gone
          ? el('span', { class: 'chip' }, 'regular app')
          : el('button', {
            class: 'btn small',
            disabled: state.pending.size > 0,
            'aria-label': `Restore ${change.pkg}`,
            onclick: () => act('restore', [change.pkg], { undo: [] }),
          }, icon('restore', 12), 'Restore')));
    }
    return card;
  }

  function overviewSkeleton() {
    const bone = (w, h = 12) => el('div', { class: 'bone', style: `width:${w};max-width:100%;height:${h}px` });
    return [
      el('section', { class: `card hero${magic ? ' staged' : ''}`, 'aria-busy': 'true', 'aria-label': state.waiting || 'Scanning the phone' },
        el('div', { class: 'hero-main' },
          el('div', { style: 'display:grid;gap:16px' }, bone('160px'), bone('420px', 24), bone('520px')),
          el('div', { class: 'hero-actions' }, bone('152px', 36))),
        stage()),
      el('div', { class: 'tiles' }, [0, 1, 2].map(() => el('section', { class: 'card tile' },
        bone('96px'), el('div', { class: 'tile-main' }, bone('56px', 24), bone('96px', 24)), bone('168px')))),
      el('div', { class: 'split' }, [0, 1].map(() => el('section', { class: 'card' },
        el('div', { class: 'card-head' }, bone('120px', 16)),
        [0, 1, 2].map(() => el('div', { class: 'plan-row' }, bone('60%'), bone('24px')))))),

  }

  // ---- Lists ---------------------------------------------------------------

  function listSkeleton() {
    const widths = [[38, 52], [30, 44], [44, 36], [34, 58], [40, 30], [28, 48], [36, 40]];
    return el('section', { class: 'card skeleton', 'aria-busy': 'true', 'aria-label': state.waiting || 'Scanning the phone' },
      el('div', { class: 'toolbar' },
        el('div', { class: 'bone', style: 'width:16px;height:16px;border-radius:4px' }),
        el('div', { class: 'bone', style: 'width:264px;height:36px;border-radius:8px' }),
        el('div', { class: 'grow' }), el('div', { class: 'bone', style: 'width:64px' })),
      widths.map(([a, b]) => el('div', { class: 'row' },
        el('div', { class: 'bone', style: 'width:16px;height:16px;border-radius:4px' }),
        el('div', { class: 'app' },
          el('div', { class: 'bone', style: 'width:28px;height:28px;border-radius:8px' }),
          el('div', { style: 'display:grid;gap:8px' }, el('div', { class: 'bone', style: `width:${a + 20}%` }), el('div', { class: 'bone', style: `width:${a + 36}%;height:8px` }))),
        el('div', { class: 'bone', style: `width:${b + 20}%` }),
        el('div', {}))));
  }

  // No way to the phone is not an error to report but a thing to walk
  // through. Anything else is said as it is.
  function errorCard() {
    if (state.link.kind !== 'ready') return coachCard();
    return el('section', { class: 'card' },
      el('div', { class: 'state error', role: 'alert' },
        icon('alert', 32),
        el('strong', {}, 'The scan did not finish'),
        el('p', {}, state.error),
        el('button', { class: 'btn primary', onclick: () => scan() }, icon('refresh'), 'Try again')));
  }

  function listCard(view) {
    if (rows().length === 0) {
      return el('section', { class: 'card' },
        el('div', { class: 'state' },
          icon('done', 32),
          el('strong', {}, view.empty),
          el('button', { class: 'btn primary', onclick: () => scan() }, icon('refresh'), 'Scan again')));
    }
    ui.all = view.primary ? el('input', { type: 'checkbox', 'aria-label': 'Select all shown', onchange: toggleAll }) : null;
    ui.count = el('span', { class: 'count mono' });
    ui.search = el('input', {
      class: 'field', type: 'search', placeholder: 'Filter this list', value: state.filter,
      'aria-label': 'Filter this list', 'aria-keyshortcuts': '/',
      oninput: e => { state.filter = e.target.value; paint(); },
    });
    ui.rows = el('div', { class: 'rows' });
    const card = el('section', { class: 'card' },
      el('div', { class: 'toolbar' },
        ui.all,
        el('div', { class: 'search' }, icon('search'), ui.search),
        el('div', { class: 'grow' }),
        ui.count),
      ui.rows);
    paint();
    return card;
  }

  // Redraws the rows and counts without touching the filter box, so typing in
  // it keeps its focus.
  function paint() {
    const view = VIEWS[state.view];
    if (!view.blurb || state.status !== 'ready' || !ui.rows || rows().length === 0) return renderBulk();
    const shown = visibleRows();
    const pickable = shown.filter(selectable);
    const picked = pickable.filter(r => state.selected.has(r.pkg)).length;

    if (ui.all) {
      ui.all.checked = pickable.length > 0 && picked === pickable.length;
      ui.all.indeterminate = picked > 0 && picked < pickable.length;
      ui.all.disabled = pickable.length === 0;
    }
    ui.count.textContent = shown.length === rows().length
      ? `${shown.length} in this list` : `${shown.length} of ${rows().length} shown`;

    if (shown.length === 0) {
      set(ui.rows, el('div', { class: 'state' },
        icon('search', 32),
        el('strong', {}, 'Nothing in this list matches that filter.'),
        el('button', { class: 'btn', onclick: () => { state.filter = ''; ui.search.value = ''; paint(); } }, 'Clear the filter')));
    } else {
      set(ui.rows, shown.map((row, i) => rowNode(row, view, i)));
    }
    ui.rows.classList.toggle('bare', !ui.rows.querySelector('.chips > *'));
    return renderBulk();
  }

  function rowNode(row, view, index) {
    const can = selectable(row);
    const said = Words.describe(row, state.view, known());
    const chips = chipNodes(said.chips);
    if (state.view !== 'off' && reinstalls(row.pkg)) chips.unshift(el('span', { class: 'chip bad' }, 'puts apps back'));
    if (state.pending.has(row.pkg)) chips.push(el('span', { class: 'chip' }, 'working'));

    const toggle = () => {
      if (state.selected.has(row.pkg)) state.selected.delete(row.pkg);
      else state.selected.add(row.pkg);
      paint();
    };
    // A click ticks the row; the arrow at its end opens everything known
    // about the app. A row that cannot be ticked opens that straight away.
    return el('div', {
      class: `row${state.selected.has(row.pkg) ? ' selected' : ''}${state.pending.has(row.pkg) ? ' pending' : ''}${state.detail === row.pkg ? ' open' : ''}`,
      'data-pkg': row.pkg, style: `--i:${index}`,
      onclick: can ? toggle : () => openDetail(row.pkg),
    },
    can ? el('input', {
      type: 'checkbox', checked: state.selected.has(row.pkg), 'aria-label': `Select ${said.title}`,
      onclick: e => e.stopPropagation(), onchange: toggle,
    }) : el('span', {}),
    appCell(row.pkg, said.title),
    el('div', { class: 'note' }, said.about),
    el('div', { class: 'chips' }, chips),
    el('button', {
      class: 'btn quiet small more', 'aria-label': `About ${said.title}`,
      onclick: event => { event.stopPropagation(); openDetail(row.pkg); },
    }, icon('chevron', 16)));
  }

  function toggleAll(event) {
    for (const row of visibleRows().filter(selectable)) {
      if (event.target.checked) state.selected.add(row.pkg);
      else state.selected.delete(row.pkg);
    }
    paint();
  }

  // The actions for a selection: they appear only once there is one.
  function renderBulk() {
    const bar = document.getElementById('bulk');
    const view = VIEWS[state.view];
    const n = state.selected.size;
    const show = n > 0 && state.status === 'ready' && Boolean(view.primary);
    bar.classList.toggle('show', show);
    document.body.classList.toggle('has-bulk', show);
    if (!show) return;
    const button = (action, primary) => el('button', {
      class: `btn${primary ? ' primary' : ''}`,
      disabled: state.pending.size > 0,
      onclick: () => run(action),
    }, icon(WORDS[action].icon), primary ? `${WORDS[action].verb} ${n}` : WORDS[action].verb);
    set(bar,
      el('span', { class: 'n mono' }, `${n} selected`),
      el('button', { class: 'btn quiet small', onclick: () => { state.selected.clear(); paint(); } }, icon('x', 12), 'Clear'),
      el('span', { class: 'sep' }),
      view.secondary ? button(view.secondary, false) : null,
      button(view.primary, true));
  }

  async function run(action) {
    const packages = [...state.selected];
    if (packages.length === 0) return;
    if (action === 'uninstall') {
      const sure = await ask({
        title: `Uninstall ${plural(packages.length, 'app', 'apps')}?`,
        text: 'These are regular apps. Their data on the phone is deleted, and the only way to get one back is to install it again from the Play Store.',
        yes: `Uninstall ${packages.length}`,
      });
      if (!sure) return;
      await act(action, packages, { undo: [] });
      return;
    }
    await act(action, packages);
  }

  // ---- Review before cleaning ----------------------------------------------

  // Everything the cleanup would do, ticked, in two groups by whether it can
  // be undone. Untick to keep; nothing happens until the button is pressed.
  function review() {
    const items = cleanup();
    const picked = new Set(items.map(r => r.pkg));
    const dialog = document.getElementById('dialog');
    const groups = [
      { title: 'Uninstall', hint: 'regular apps, cannot be undone', rows: items.filter(r => r.app) },
      { title: 'Remove', hint: 'preinstalled, can be undone from Already off', rows: items.filter(r => !r.app) },
    ].filter(g => g.rows.length);

    const body = el('div', { class: 'dialog-body' });
    const summary = el('div', { class: 'grow' });
    const confirm = el('button', { class: 'btn primary' });
    const close = () => dialog.close();

    const draw = () => {
      set(body, groups.map(group => {
        const mine = group.rows.filter(r => picked.has(r.pkg)).length;
        const all = el('input', {
          type: 'checkbox', 'aria-label': `Select all under ${group.title}`,
          onchange: e => {
            for (const r of group.rows) {
              if (e.target.checked) picked.add(r.pkg);
              else picked.delete(r.pkg);
            }
            draw();
          },
        });
        all.checked = mine === group.rows.length;
        all.indeterminate = mine > 0 && mine < group.rows.length;
        return [
          el('div', { class: 'group-head' }, all, el('b', {}, group.title),
            el('span', {}, `${mine} of ${group.rows.length}, ${group.hint}`)),
          group.rows.map(row => {
            const flip = () => {
              if (picked.has(row.pkg)) picked.delete(row.pkg);
              else picked.add(row.pkg);
              draw();
            };
            const said = Words.describe(row, row.from, known());
            return el('div', { class: `row${picked.has(row.pkg) ? ' selected' : ''}`, onclick: flip },
              el('input', {
                type: 'checkbox', checked: picked.has(row.pkg), 'aria-label': `Select ${said.title}`,
                onclick: e => e.stopPropagation(), onchange: flip,
              }),
              appCell(row.pkg, said.title),
              el('div', { class: 'note' }, said.about));
          }),
        ];
      }));
      const apps = items.filter(r => r.app && picked.has(r.pkg)).length;
      const system = picked.size - apps;
      summary.textContent = [
        apps ? `uninstalls ${apps} for good` : '',
        system ? `removes ${system}, which can be undone` : '',
      ].filter(Boolean).join(' and ').replace(/^./, c => c.toUpperCase()) || 'Nothing ticked';
      set(confirm, icon('review'), picked.size ? `Clean up ${picked.size}` : 'Clean up');
      confirm.disabled = picked.size === 0;
    };

    confirm.onclick = async () => {
      const chosen = items.filter(r => picked.has(r.pkg));
      close();
      await act('cleanup', chosen.map(r => r.pkg), { undo: chosen.filter(r => !r.app).map(r => r.pkg) });
    };
    dialog.classList.add('wide');
    set(dialog,
      el('div', { class: 'dialog-head' },
        el('h2', {}, 'Review cleanup'),
        el('p', {}, 'Everything below is ticked. Untick anything you want to keep, then clean up.')),
      body,
      el('div', { class: 'dialog-foot' }, summary,
        el('button', { class: 'btn', onclick: close }, 'Cancel'), confirm));
    dialog.oncancel = null;
    draw();
    dialog.showModal();
  }

  // ---- The wizard ----------------------------------------------------------

  // The same cleanup as "Review as a list", walked through a step at a time
  // by the wizard on a screen of his own: find the phone, scan it, choose
  // what goes, clean up, and see what happened. It asks the helper for
  // exactly what the list asks for. The show is drawn from the answers: the
  // lightning falls only on what the phone says is gone.
  const STEPS = [['connect', 'Phone'], ['scan', 'Scan'], ['choose', 'Choose'], ['cast', 'Clean up'], ['done', 'Done']];
  const wiz = { open: false, run: 0, step: '', busy: false, items: [], picked: new Set() };
  const wizNode = document.getElementById('wiz');
  const wizBack = document.getElementById('wiz-back');
  const BEHIND = ['side', 'bulk', 'toast'];
  let typing = 0;

  // His line appears as he says it. A screen reader gets it whole.
  function say(node, text) {
    typing += 1;
    const mine = typing;
    if (still() || !magic) {
      node.textContent = text;
      return;
    }
    let shown = 0;
    magic.talking(true);
    const more = () => {
      if (mine !== typing) return;
      shown += 2;
      node.textContent = text.slice(0, shown);
      if (shown < text.length) setTimeout(more, 22);
      else magic.talking(false);
    };
    more();
  }

  // One screen of his: where in the steps it is, what he says, what is under
  // that, and the buttons.
  function wizShow({ step, line, sub = '', body = null, note = '', buttons = [] }) {
    wiz.step = step;
    const at = STEPS.findIndex(([id]) => id === step);
    const lineNode = el('p', { class: 'wiz-line', 'aria-hidden': 'true' });
    set(wizNode,
      el('div', { class: 'wiz-top' },
        el('ol', { class: 'wiz-steps', 'aria-label': 'Steps' }, STEPS.map(([, label], i) => el('li', {
          class: i < at ? 'done' : i === at ? 'now' : null, 'aria-current': i === at ? 'step' : null,
        }, label))),
        el('button', { class: 'btn quiet small', onclick: closeWizard, disabled: wiz.busy, 'aria-label': 'Leave the wizard' },
          icon('x', 12), 'Close')),
      el('div', { class: 'wiz-say' },
        lineNode,
        el('p', { class: 'sr', role: 'status' }, line),
        sub ? el('p', { class: 'wiz-sub' }, sub) : null),
      el('div', { class: 'wiz-body' }, body),
      el('div', { class: 'wiz-foot' }, el('div', { class: 'grow' }, note), buttons));
    say(lineNode, line);
    const first = wizNode.querySelector('.wiz-foot .btn.primary:not(:disabled)') || wizNode.querySelector('.wiz-top .btn:not(:disabled)');
    if (first) first.focus({ preventScroll: true });
  }

  // Where on his screen he and the phone stand: beside the pane, or above it
  // when the window is too narrow for both.
  function aim() {
    if (!wiz.open) return;
    const beside = wizNode.offsetLeft > innerWidth * 0.3;
    wizBack.dataset.into = beside
      ? `0.02 0.14 ${((wizNode.offsetLeft - 16) / innerWidth).toFixed(3)} 0.95`
      : `0.04 0.03 0.96 ${((wizNode.offsetTop - 8) / innerHeight).toFixed(3)}`;
  }

  function openWizard(options) {
    if (wiz.open || !magic) return;
    const dialog = document.getElementById('dialog');
    if (dialog.open) dialog.close();
    wiz.open = true;
    wiz.run += 1;
    // Asked for the apps with a catch, he goes straight to those.
    wiz.deck = Boolean(options && options.deck === true);
    state.detail = '';
    renderDetail();
    for (const id of BEHIND) document.getElementById(id).inert = true;
    document.querySelector('main').inert = true;
    wizBack.hidden = false;
    wizBack.dataset.stage = 'full';
    wizNode.hidden = false;
    aim();
    syncMagic();
    magic.shades(false);
    magic.act('hello');
    // He comes out with a turn on the spot, once his own screen is up.
    const run = wiz.run;
    setTimeout(() => { if (magic && wiz.open && run === wiz.run) magic.poke(); }, 140);
    wizScan();
  }

  function closeWizard() {
    if (!wiz.open || wiz.busy) return;
    wiz.open = false;
    wiz.run += 1;
    typing += 1;
    if (magic) magic.talking(false);
    wizBack.hidden = true;
    delete wizBack.dataset.stage;
    wizNode.hidden = true;
    wizNode.replaceChildren();
    for (const id of BEHIND) document.getElementById(id).inert = false;
    document.querySelector('main').inert = false;
    render();
    const back = document.querySelector('[data-wizard]') || document.getElementById('pal');
    if (back && !back.hidden) back.focus({ preventScroll: true });
  }

  // No way to the phone yet: the same walk-through as the overview gives,
  // in his words, with the phone beside him showing what it is waiting
  // for. The page keeps looking (watchLink) and brings him on when one
  // answers.
  function wizConnect() {
    const kind = state.link.kind;
    if (kind === 'ready') {
      // A phone is there and the scan still failed: say what it said.
      magic.act('idle');
      magic.act('shrug');
      return wizShow({
        step: 'scan',
        line: 'The scan did not finish.',
        sub: state.error,
        buttons: [el('button', { class: 'btn primary', onclick: wizScan }, icon('refresh'), 'Try again')],
      });
    }
    const said = coach();
    const asking = kind === 'unauthorized';
    magic.tiles([]);
    magic.phone(asking ? 'ask' : 'none');
    magic.shades(false);
    magic.act(asking ? 'think' : 'search');
    wizShow({
      step: 'connect',
      line: {
        nophone: 'I cannot see a phone yet.',
        unauthorized: 'I can see it. It wants your say-so.',
        offline: 'It is there, but it will not answer.',
        noadb: 'I am missing a tool.',
        broken: 'Something is wrong with adb.',
        nohelper: 'I have lost my helper.',
      }[kind],
      sub: said.text,
      body: said.body.length ? el('div', { class: 'wiz-coach' }, coachPips(said.done), el('div', { class: 'coach-body' }, said.body)) : null,
      note: kind === 'nohelper' ? '' : 'I look again every few seconds.',
      buttons: kind === 'nohelper' ? [] : [el('button', { class: 'btn primary', onclick: wizScan }, icon('refresh'), 'Look now')],
    });
    return watchLink();
  }

  async function wizScan() {
    const run = wiz.run;
    magic.tiles([]);
    magic.phone('scan');
    magic.shades(false);
    magic.act('scan');
    wizShow({
      step: 'scan',
      line: 'Hold still. I am looking inside.',
      sub: 'Reading what is installed, what installed it, and what the rules say about each. Nothing changes yet.',
    });
    // Long enough to be seen looking, however quick the phone is.
    await Promise.all([scan({ quiet: true }), sleep(still() ? 0 : 1900)]);
    if (run !== wiz.run) return undefined;
    if (state.status !== 'ready') return wizConnect();
    wiz.items = cleanup();
    wiz.picked = new Set(wiz.items.map(row => row.pkg));
    if (wiz.deck) {
      wiz.deck = false;
      return wizDeck();
    }
    return wizFound();
  }

  // The apps with a catch, on his screen, one to a card. The one being
  // asked about lights up beside the phone; the ones kept drift off.
  function wizDeck() {
    const rows = state.scan.lists.ask.filter(row => !row.locked);
    if (!rows.length) return wizFound();
    const host = el('div', {});
    magic.tiles(rows.map(row => ({ id: row.pkg, kind: 'ask' })));
    magic.phone('idle', 0.1);
    magic.shades(false);
    magic.act('think');
    wizShow({
      step: 'choose',
      line: plural(rows.length, 'app has a catch.', 'apps each have a catch.').replace(/^\d+ /, rows.length === 1 ? 'This ' : `These ${rows.length} `),
      sub: 'One at a time: keep it, or remove it. Nothing changes until the end.',
      body: host,
    });
    deck(rows, host, {
      show: (row, choice) => {
        for (const each of rows) {
          magic.tile(each.pkg, row && each.pkg === row.pkg ? 'aim' : choice.get(each.pkg) === 'keep' ? 'keep' : 'orbit');
        }
      },
      cancel: () => (cleanup().length ? wizFound() : closeWizard()),
      done: going => wizCast(going, rows),
    });
    return undefined;
  }

  // What the scan found. Each thing that can go is now circling the phone.
  function wizFound() {
    const items = wiz.items;
    const apps = items.filter(row => row.app).length;
    const asks = state.scan.lists.ask.length;
    const stat = (n, label) => el('div', { class: 'wiz-stat' }, el('b', {}, n), el('span', {}, label));
    const stats = el('div', { class: 'wiz-stats' },
      stat(apps, 'pushed on by an installer'),
      stat(items.length - apps, 'preinstalled junk'),
      stat(asks, 'to look at first'));
    const later = asks
      ? ` ${plural(asks, 'more needs', 'more need')} a look first; we can go through ${asks === 1 ? 'it' : 'them'} afterwards.`
      : '';
    const putBack = items.filter(row => reinstalls(row.pkg)).length;
    const installersSay = putBack ? ` The ${putBack === 1 ? 'red one is an installer' : `${putBack} red ones are installers`}: the kind that puts the rest back.` : '';
    magic.tiles(items.map(row => ({ ...tileOf(row), state: wiz.picked.has(row.pkg) ? 'orbit' : 'keep' })));
    magic.phone(items.length ? 'idle' : 'clean', items.length / 24);
    magic.shades(items.length === 0);
    magic.act(items.length ? 'think' : 'cool');
    if (!items.length) {
      return wizShow({
        step: 'scan',
        line: 'Spotless. Nothing here I would send away.',
        sub: `The sponsored-app installers, lock screen feeds and promos the rules cover are gone, or were never here.${later}`,
        body: stats,
        buttons: [el('button', { class: 'btn primary', onclick: closeWizard }, 'Close')],
      });
    }
    return wizShow({
      step: 'scan',
      line: `${plural(items.length, 'thing', 'things')} on this phone ${items.length === 1 ? 'does' : 'do'} not belong.`,
      sub: `That is ${items.length === 1 ? 'it' : 'them'}, circling the phone.${installersSay}${later}`,
      body: stats,
      note: 'Nothing changes until you say so.',
      buttons: [el('button', { class: 'btn primary', onclick: wizChoose }, 'Choose what goes', icon('next'))],
    });
  }

  // Everything ticked, in two groups by whether it can be undone, as in the
  // list. What is unticked drifts away from the phone and cools.
  function wizChoose() {
    const items = wiz.items;
    const picked = wiz.picked;
    const groups = [
      { title: 'Uninstall', hint: 'regular apps, cannot be undone', rows: items.filter(row => row.app) },
      { title: 'Remove', hint: 'preinstalled, can be undone from Already off', rows: items.filter(row => !row.app) },
    ].filter(group => group.rows.length);
    const body = el('div', {});
    const note = el('span', {});
    const go = el('button', { class: 'btn primary', onclick: () => wizCast() });
    const mark = row => magic.tile(row.pkg, picked.has(row.pkg) ? 'orbit' : 'keep');

    const draw = () => {
      set(body, groups.map(group => {
        const mine = group.rows.filter(row => picked.has(row.pkg)).length;
        const all = el('input', {
          type: 'checkbox', 'aria-label': `Select all under ${group.title}`,
          onchange: event => {
            for (const row of group.rows) {
              if (event.target.checked) picked.add(row.pkg);
              else picked.delete(row.pkg);
              mark(row);
            }
            draw();
          },
        });
        all.checked = mine === group.rows.length;
        all.indeterminate = mine > 0 && mine < group.rows.length;
        return [
          el('div', { class: 'group-head' }, all, el('b', {}, group.title),
            el('span', {}, `${mine} of ${group.rows.length}, ${group.hint}`)),
          group.rows.map(row => {
            const flip = () => {
              if (picked.has(row.pkg)) picked.delete(row.pkg);
              else picked.add(row.pkg);
              mark(row);
              draw();
            };
            // Pointing at a row lights up the one it means.
            return el('div', {
              class: `row${picked.has(row.pkg) ? ' selected' : ''}`, onclick: flip,
              onpointerenter: () => { if (picked.has(row.pkg)) magic.tile(row.pkg, 'aim'); },
              onpointerleave: () => mark(row),
            },
            el('input', {
              type: 'checkbox', checked: picked.has(row.pkg), 'aria-label': `Select ${Words.readable(row.pkg)}`,
              onclick: event => event.stopPropagation(), onchange: flip,
            }),
            appCell(row.pkg),
            el('div', { class: 'note' }, Words.describe(row, row.from, known()).about));
          }),
        ];
      }));
      const apps = items.filter(row => row.app && picked.has(row.pkg)).length;
      const system = picked.size - apps;
      note.textContent = [
        apps ? `uninstalls ${apps} for good` : '',
        system ? `removes ${system}, which can be undone` : '',
      ].filter(Boolean).join(' and ').replace(/^./, c => c.toUpperCase()) || 'Nothing ticked';
      set(go, icon('zap'), picked.size ? `Clean up ${picked.size}` : 'Clean up');
      go.disabled = picked.size === 0;
    };

    magic.act('idle');
    wizShow({
      step: 'choose',
      line: 'Untick anything you would rather keep.',
      sub: 'What came with the phone can be brought back later. A regular app cannot: its data goes with it.',
      body,
      note,
      buttons: [el('button', { class: 'btn', onclick: wizFound }, 'Back'), go],
    });
    draw();
  }

  // `chosen` is what goes, out of `all` that are circling the phone: the
  // ticked ones from the cleanup, or the ones marked on the cards.
  async function wizCast(chosen = wiz.items.filter(row => wiz.picked.has(row.pkg)), all = wiz.items) {
    if (!chosen.length || wiz.busy) return undefined;
    const packages = chosen.map(row => row.pkg);
    const going = new Set(packages);
    wiz.busy = true;
    for (const row of all) magic.tile(row.pkg, going.has(row.pkg) ? 'aim' : 'keep');
    magic.act('channel');
    wizShow({
      step: 'cast',
      line: 'Stand back.',
      sub: `Taking ${plural(packages.length, 'app', 'apps')} off the phone. Leave it plugged in until I am done.`,
      body: el('div', {}, chosen.map(row => el('div', { class: 'row told pending' }, appCell(row.pkg),
        el('span', { class: 'chip' }, 'working')))),
    });
    for (const pkg of packages) state.pending.add(pkg);
    const [result] = await Promise.all([
      api('/api/act', { method: 'POST', body: { action: 'remove', packages, serial: state.serial } }),
      sleep(still() ? 0 : 1700),
    ]);
    for (const pkg of packages) state.pending.delete(pkg);
    log(`Clean up ${plural(packages.length, 'app', 'apps')}`, result.output || result.error);
    const how = Words.outcomes(result.output, packages);
    const gone = packages.filter(pkg => how.has(pkg) && how.get(pkg).done);
    if (gone.length) state.needsRestart = true;
    // The phone has answered. Now the lightning, and only for what went.
    await magic.zapTiles(gone, gone.length > 12 ? 90 : 170);
    for (const pkg of packages) if (!gone.includes(pkg)) magic.tile(pkg, 'fail');
    await scan({ quiet: true });
    wiz.busy = false;
    return wizDone(result, chosen, how);
  }

  function wizDone(result, chosen, how) {
    const done = row => how.has(row.pkg) && how.get(row.pkg).done;
    const gone = chosen.filter(done);
    const stuck = chosen.filter(row => !done(row));
    const undo = gone.filter(row => !row.app).map(row => row.pkg);
    const left = state.status === 'ready' ? cleanup().length : 0;
    const told = el('div', {}, chosen.map(row => {
      const said = how.has(row.pkg) ? how.get(row.pkg).said : 'no answer';
      const tone = !done(row) ? ' bad' : /^(removed|uninstalled)$/.test(said) ? ' ok' : ' warn';
      return el('div', { class: 'row told' }, appCell(row.pkg),
        el('span', { class: `chip${tone}` }, said === 'FAILED' ? 'locked by the maker' : said));
    }));
    const close = primary => el('button', { class: `btn${primary ? ' primary' : ''}`, onclick: closeWizard }, 'Close');
    // Android would not remove some, and the tool fell back: say so, since
    // "switched off" beside an app asked to be removed wants explaining.
    const fellBack = gone.filter(row => /^(switched off|silenced)$/.test(how.get(row.pkg).said)).length;
    const asks = state.status === 'ready' ? state.scan.lists.ask.filter(row => !row.locked).length : 0;
    const report = `MAXAPACITY Debloat ${VERSION}\n${result.output || ''}`.trim();

    if (!gone.length) {
      magic.act('idle');
      magic.act('shrug');
      return wizShow({
        step: 'done',
        line: result.ok ? 'They would not budge.' : 'That did not work.',
        sub: result.ok ? 'The phone\'s maker has locked what is listed below. Nothing about it was changed.' : result.error,
        body: result.ok ? told : null,
        buttons: [el('button', { class: 'btn', onclick: wizScan }, icon('refresh'), 'Scan again'), close(true)],
      });
    }
    magic.phone(left ? 'idle' : 'clean', left / 24);
    magic.shades(true);
    magic.act('cool');
    magic.act('cheer');
    magic.celebrate();
    return wizShow({
      step: 'done',
      line: `${plural(gone.length, 'app', 'apps')} gone.${stuck.length ? ` ${stuck.length} would not budge.` : ''}`,
      sub: [
        'Restart the phone so its lock and home screens catch up.',
        fellBack ? ` Android would not remove ${fellBack === 1 ? 'one of them' : `${fellBack} of them`}, so ${fellBack === 1 ? 'it is' : 'they are'} switched off or silenced instead, which stops ${fellBack === 1 ? 'it' : 'them'} just the same.` : '',
        stuck.length ? ' What would not budge is locked by the phone\'s maker; nothing about it was changed.' : '',
      ].join(''),
      body: told,
      note: [
        undo.length ? el('button', { class: 'btn quiet small', onclick: () => wizUndo(undo) }, icon('undo', 12), `Undo ${undo.length}`) : null,
        el('button', { class: 'btn quiet small', onclick: event => copy(report, event.currentTarget) }, icon('copy', 12), 'Copy what was done'),
      ],
      buttons: [
        asks ? el('button', { class: 'btn', onclick: wizDeck }, icon('layers'), `Go through ${asks} more`) : close(false),
        el('button', { class: 'btn primary', onclick: wizRestart }, icon('power'), 'Restart phone'),
      ],
    });
  }

  async function wizUndo(packages) {
    if (wiz.busy) return undefined;
    wiz.busy = true;
    magic.shades(false);
    magic.act('channel');
    wizShow({
      step: 'done',
      line: 'Putting them back.',
      sub: `Restoring ${plural(packages.length, 'app', 'apps')} to the phone.`,
    });
    const result = await api('/api/act', { method: 'POST', body: { action: 'restore', packages, serial: state.serial } });
    log(`Restore ${plural(packages.length, 'app', 'apps')}`, result.output || result.error);
    await scan({ quiet: true });
    wiz.busy = false;
    if (state.status !== 'ready') return wizConnect();
    wiz.items = cleanup();
    wiz.picked = new Set(wiz.items.map(row => row.pkg));
    return wizFound();
  }

  async function wizRestart() {
    if (wiz.busy) return undefined;
    wiz.busy = true;
    magic.tiles([]);
    magic.phone('none');
    magic.act('search');
    wizShow({
      step: 'done',
      line: 'Restarting the phone.',
      sub: 'It drops off USB for about a minute. I will know when it is back.',
    });
    const result = await api(`/api/restart${query()}`, { method: 'POST' });
    log('Restart the phone', result.output || result.error);
    if (!result.ok) {
      wiz.busy = false;
      magic.act('idle');
      magic.act('shrug');
      return wizShow({
        step: 'done',
        line: 'It would not restart.',
        sub: result.error,
        buttons: [el('button', { class: 'btn primary', onclick: closeWizard }, 'Close')],
      });
    }
    state.needsRestart = false;
    await comeBack();
    await scan({ quiet: true });
    wiz.busy = false;
    if (state.status !== 'ready') return wizConnect();
    const left = cleanup().length;
    magic.phone(left ? 'idle' : 'clean', left / 24);
    magic.tiles(cleanup().map(tileOf));
    magic.shades(true);
    magic.act('cool');
    return wizShow({
      step: 'done',
      line: 'Back, and quieter than it was.',
      sub: left
        ? `${plural(left, 'thing is', 'things are')} still on it that could go. Scan again after a system update too: updates can bring things back.`
        : 'Scan again after a system update: updates can switch back on what was removed.',
      buttons: [el('button', { class: 'btn primary', onclick: closeWizard }, 'Close')],
    });
  }

  // ---- One app, in full ----------------------------------------------------

  // Which list says most about an app, when it is in several.
  const ORDER = ['back', 'remove', 'ask', 'pushed', 'off', 'keep', 'unknown', 'other', 'notifying'];

  function openDetail(pkg) {
    state.detail = pkg;
    renderDetail();
    syncMagic();
  }
  function closeDetail() {
    if (!state.detail) return;
    state.detail = '';
    renderDetail();
    syncMagic();
  }

  // Everything the scan knows about one app, beside the list it came from:
  // what it is, what taking it off means, how it got here, and the buttons
  // to act on it alone.
  function renderDetail() {
    const panel = document.getElementById('detail');
    const pkg = state.detail;
    const lists = state.scan && state.status === 'ready' && !wiz.open ? state.scan.lists : null;
    const where = lists && pkg ? ORDER.filter(name => lists[name].some(row => row.pkg === pkg)) : [];
    for (const node of document.querySelectorAll('.row[data-pkg]')) node.classList.toggle('open', where.length > 0 && node.dataset.pkg === pkg);
    document.body.classList.toggle('has-detail', where.length > 0);
    if (!where.length) {
      state.detail = '';
      panel.hidden = true;
      panel.replaceChildren();
      return;
    }
    const find = name => lists[name].find(row => row.pkg === pkg);
    const row = find(where[0]);
    const said = Words.describe(row, where[0], known());
    const off = where.includes('off');
    const kept = where.includes('keep') || row.locked;
    const ruled = ['remove', 'ask', 'keep'].find(name => where.includes(name));
    const listed = ruled ? Words.community(find(ruled).note)
      : where.includes('unknown') ? Words.community(find('unknown').note.split('; ').slice(1).join('; ')) : null;
    const what = known().get(pkg) || (listed ? listed.text : '');
    const busy = state.pending.size > 0;

    const facts = [];
    if (where.includes('back')) facts.push('Removed earlier, and back again.');
    for (const name of ['pushed', 'other']) if (where.includes(name)) facts.push(`${Words.describe(find(name), name, known()).about}.`);
    if (where.includes('notifying')) {
      const up = parseInt(find('notifying').note, 10) || 0;
      facts.push(`${plural(up, 'notification', 'notifications')} up at the last scan.`);
    }
    if (where.includes('unknown') && !listed) {
      const place = Words.describe(find('unknown'), 'unknown', known()).about;
      if (place) facts.push(`${place}.`);
    }
    const last = state.scan.changes.filter(change => change.pkg === pkg).pop();
    if (last) facts.push(`${(DID[last.action] || last.action).replace(/^./, c => c.toUpperCase())} by this tool${ago(last.when) ? `, ${ago(last.when)}` : ''}.`);

    const consequence = kept ? 'The phone needs this one to work. Nothing here will touch it.'
      : off ? 'It is out of the way now. Restore puts it back as it was.'
        : row.app ? 'It is a regular app, so it is uninstalled for good, with its data. The only way back is the Play Store.'
          : 'It came with the phone, so it is taken off for this user only, and Already off brings it back whenever you like. Where Android will not remove it, it is switched off instead, which stops it just the same.';

    const one = async (action, sure) => {
      if (sure && !(await ask(sure))) return;
      act(action, [pkg], action === 'uninstall' || action === 'restore' ? { undo: [] } : undefined);
    };
    const buttons = kept ? []
      : off ? [el('button', { class: 'btn primary', disabled: busy, onclick: () => one('restore') }, icon('restore'), 'Restore')]
        : row.app ? [el('button', {
          class: 'btn primary', disabled: busy,
          onclick: () => one('uninstall', { title: `Uninstall ${said.title}?`, text: 'Its data on the phone is deleted, and the only way back is to install it again from the Play Store.', yes: 'Uninstall' }),
        }, icon('trash'), 'Uninstall')]
          : [el('button', { class: 'btn primary', disabled: busy, onclick: () => one('remove') }, icon('trash'), 'Remove'),
            el('button', { class: 'btn', disabled: busy, onclick: () => one('mute') }, icon('mute'), 'Silence')];

    panel.hidden = false;
    set(panel,
      el('div', { class: 'detail-head' },
        el('span', { class: 'app-mark', 'aria-hidden': 'true' }, Words.initial(pkg)),
        el('div', {}, el('h2', {}, said.title), pkgNode(pkg)),
        el('button', { class: 'btn quiet small', 'aria-label': 'Close', onclick: closeDetail }, icon('x', 12))),
      el('div', { class: 'detail-body' },
        el('div', { class: 'chips' },
          where.map(name => el('span', { class: 'chip' }, VIEWS[name].label)),
          reinstalls(pkg) ? el('span', { class: 'chip bad' }, 'puts apps back') : null,
          row.app ? el('span', { class: 'chip' }, 'regular app') : null,
          kept ? el('span', { class: 'chip' }, 'protected') : null),
        el('section', {},
          el('h3', {}, 'What it is'),
          el('p', {}, what || 'No rule covers this app, and the phone does not say what it is. The name above is a reading of its package name.'),
          what ? el('p', { class: 'check-detail' }, listed ? `From the community list, which rates removing it "${listed.rating}".` : 'From the built-in rules.') : null),
        el('section', {},
          el('h3', {}, off ? 'If you bring it back' : 'If you take it off'),
          el('p', {}, consequence),
          reinstalls(pkg) ? el('p', {}, 'It can put apps on the phone by itself. Take it off before the apps it installed, or they come back.') : null),
        facts.length ? el('section', {}, el('h3', {}, 'On this phone'), el('ul', { class: 'facts' }, facts.map(fact => el('li', {}, fact)))) : null,
        el('div', { class: 'detail-links' },
          el('button', { class: 'btn quiet small', onclick: event => copy(pkg, event.currentTarget) }, icon('copy', 12), 'Copy package name'),
          el('a', {
            class: 'btn quiet small', target: '_blank', rel: 'noopener noreferrer',
            href: `https://www.google.com/search?q=${encodeURIComponent(`"${pkg}" android`)}`,
          }, icon('external', 12), 'Look it up on the web'))),
      el('div', { class: 'detail-foot' }, buttons));
  }

  // ---- Find anything -------------------------------------------------------

  // The wizard's robe: graphite by default, and the violet he first wore
  // for those who miss it.
  let robe = 'graphite';
  try {
    robe = localStorage.getItem('debloat-robe') === 'violet' ? 'violet' : 'graphite';
  } catch (e) { /* graphite, then */ }
  function setRobe(name) {
    robe = name;
    if (engine) engine.set({ look: name });
    try {
      localStorage.setItem('debloat-robe', name);
    } catch (e) { /* not remembered, then */ }
  }

  // Everything there is to do, everywhere there is to go, and every app the
  // last scan found.
  function commands() {
    const out = [];
    const add = (group, label, hint, iconName, run) => out.push({
      group, label, hint: hint || '', icon: iconName, run, search: `${label} ${hint || ''}`.toLowerCase(),
    });
    const ready = state.status === 'ready';
    if (ready) {
      const n = cleanup().length;
      const asks = state.scan.lists.ask.filter(row => !row.locked).length;
      if (n && magic) add('Do', 'Clean up with the wizard', `${n} can go`, 'wand', () => openWizard());
      if (n) add('Do', 'Review the cleanup as a list', `${n} can go`, 'review', review);
      if (asks) add('Do', 'Go through Ask first one at a time', plural(asks, 'app', 'apps'), 'layers', () => openDeck());
    }
    add('Do', 'Scan again', '', 'refresh', () => scan());
    if (ready) {
      const listed = Number(state.scan.meta.community) || 0;
      add('Do', 'Restart the phone', '', 'power', restart);
      add('Do', 'See what is on the phone\'s screen', '', 'eye', () => { go('activity'); inspect(); });
      add('Do', state.watch ? 'Stop watching for installs' : 'Watch for installs', '', 'radio', () => { go('activity'); toggleWatch(); });
      add('Do', listed ? 'Stop using the community list' : 'Get the community list',
        listed ? `${listed} apps described` : 'says what most preinstalled apps are', 'users', () => community(!listed));
    }
    if (engine) {
      add('Do', magic ? 'Send the wizard away' : 'Bring the wizard back', '', 'wand', () => { setMagic(!magic); render(); });
      if (magic) add('Do', robe === 'violet' ? 'Dress the wizard in graphite' : 'Dress the wizard in his old violet', '', 'wand', () => setRobe(robe === 'violet' ? 'graphite' : 'violet'));
    }
    for (const group of NAV) {
      for (const id of group.items) {
        add('Go to', VIEWS[id].label, ready && state.scan.lists[id] ? String(state.scan.lists[id].length) : '', VIEWS[id].icon, () => go(id));
      }
    }
    if (ready) {
      const seen = new Set();
      for (const name of ORDER) {
        for (const row of state.scan.lists[name]) {
          if (seen.has(row.pkg)) continue;
          seen.add(row.pkg);
          const title = Words.readable(row.pkg);
          out.push({
            group: 'Apps', label: title, hint: `${VIEWS[name].label} · ${row.pkg}`, pkg: row.pkg,
            run: () => { go(name); openDetail(row.pkg); },
            search: `${title} ${row.pkg} ${row.note} ${VIEWS[name].label}`.toLowerCase(),
          });
        }
      }
    }
    return out;
  }

  // One box for all of it: Cmd-K, or the box under the name.
  function openPalette() {
    const dialog = document.getElementById('palette');
    if (wiz.open || dialog.open || document.getElementById('dialog').open) return;
    const all = commands();
    const input = el('input', {
      type: 'text', placeholder: 'Find an app, a page, or something to do', 'aria-label': 'Find anything',
      autocomplete: 'off', spellcheck: 'false', role: 'combobox', 'aria-expanded': 'true', 'aria-controls': 'palette-list',
    });
    const list = el('div', { class: 'palette-list', id: 'palette-list', role: 'listbox' });
    let shown = [];
    let at = 0;
    const pick = i => {
      const item = shown[i];
      if (!item) return;
      dialog.close();
      item.run();
    };
    const mark = () => {
      list.querySelectorAll('.palette-item').forEach((node, i) => {
        node.classList.toggle('on', i === at);
        node.setAttribute('aria-selected', String(i === at));
        if (i === at) node.scrollIntoView({ block: 'nearest' });
      });
    };
    const draw = () => {
      const need = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      let apps = 0;
      // Apps only once something is typed, and never a screenful of them.
      // A name that matches comes before a note that happens to.
      const near = item => (need.every(word => item.label.toLowerCase().includes(word)) ? 0 : 1);
      shown = all.filter(item => need.every(word => item.search.includes(word)))
        .map((item, i) => ({ item, i }))
        .sort((a, b) => (a.item.group === b.item.group ? near(a.item) - near(b.item) || a.i - b.i : a.i - b.i))
        .map(entry => entry.item)
        .filter(item => item.group !== 'Apps' || (need.length > 0 && ++apps <= 12));
      at = 0;
      if (!shown.length) {
        set(list, el('div', { class: 'palette-empty' }, 'Nothing by that name. Part of a package name works too.'));
        return;
      }
      let group = '';
      set(list, shown.map((item, i) => {
        const head = item.group !== group ? el('div', { class: 'palette-group' }, item.group) : null;
        group = item.group;
        return [head, el('div', {
          class: `palette-item${i === at ? ' on' : ''}`, role: 'option', 'aria-selected': String(i === at),
          onclick: () => pick(i),
          onpointermove: () => { if (at !== i) { at = i; mark(); } },
        }, item.pkg ? icon('box') : icon(item.icon), el('span', { class: 'label' }, item.label), el('span', { class: 'hint' }, item.hint))];
      }));
    };
    input.addEventListener('input', draw);
    input.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (!shown.length) return;
        at = (at + (event.key === 'ArrowDown' ? 1 : shown.length - 1)) % shown.length;
        mark();
      } else if (event.key === 'Enter') {
        event.preventDefault();
        pick(at);
      }
    });
    set(dialog,
      el('div', { class: 'palette-field' }, icon('search'), input, el('kbd', {}, 'esc')),
      list,
      el('div', { class: 'palette-foot' },
        el('span', {}, el('kbd', {}, '↑'), el('kbd', {}, '↓'), 'to move'),
        el('span', {}, el('kbd', {}, '↵'), 'to choose')));
    draw();
    dialog.showModal();
    input.focus();
  }

  // ---- One at a time -------------------------------------------------------

  // The apps with a catch, one to a card: what it is, what goes with it, and
  // two keys, keep or remove. Nothing happens until the last card is past
  // and the tally agreed. `host` is where the cards are drawn; `done` gets
  // the ones marked for removal, `show` hears which card is up.
  function deck(rows, host, { done, cancel, show = () => {} }) {
    const choice = new Map();
    let at = 0;
    const count = what => [...choice.values()].filter(value => value === what).length;
    const back = () => {
      at -= 1;
      draw();
    };
    const answer = what => {
      if (at >= rows.length) return;
      choice.set(rows[at].pkg, what);
      at += 1;
      draw();
    };
    const tally = () => {
      const going = rows.filter(row => choice.get(row.pkg) === 'remove');
      show(null, choice);
      set(host, el('div', { class: 'deck' },
        el('div', { class: 'deck-count' }, el('span', {}, 'All answered'), el('span', {}, `${going.length} to remove, ${rows.length - going.length} to keep`)),
        el('div', { class: 'deck-bar' }, el('i', { style: 'width:100%' })),
        el('div', { class: 'deck-card' }, el('div', { class: 'deck-sum' },
          el('div', { class: 'app-name' }, going.length ? `Remove ${going.length} and keep ${rows.length - going.length}.` : 'Keep them all.'),
          el('p', {}, going.length ? going.map(row => Words.readable(row.pkg)).join(', ') : 'Nothing on the phone changes.'))),
        el('div', { class: 'deck-keys' },
          el('button', { class: 'btn quiet', onclick: back }, icon('back'), 'Back'),
          el('span', { class: 'grow' }),
          el('button', { class: going.length ? 'btn' : 'btn primary', onclick: cancel }, going.length ? 'Cancel' : 'Close'),
          going.length ? el('button', { class: 'btn primary', onclick: () => done(going) }, icon('zap'), `Remove ${going.length}`) : null)));
      const first = host.querySelector('.btn.primary');
      if (first) first.focus({ preventScroll: true });
    };
    function draw() {
      if (at >= rows.length) return tally();
      const row = rows[at];
      const said = Words.describe(row, 'ask', known());
      show(row, choice);
      return set(host, el('div', { class: 'deck' },
        el('div', { class: 'deck-count' }, el('span', {}, `${at + 1} of ${rows.length}`), el('span', {}, `${count('remove')} to remove, ${count('keep')} to keep`)),
        el('div', { class: 'deck-bar' }, el('i', { style: `width:${(at / rows.length) * 100}%` })),
        el('div', { class: 'deck-card' },
          appCell(row.pkg, said.title),
          el('div', {}, el('h3', {}, Words.community(row.note) ? 'What the community list says' : 'What it is, and the catch'),
            el('p', {}, said.about || 'The rules say to ask first, and no more than that.')),
          el('div', {}, el('h3', {}, 'If you remove it'), el('p', {}, row.app
            ? 'It is uninstalled for good, with its data. The Play Store is the only way back.'
            : 'It is taken off for this user. Already off brings it back whenever you like.')),
          said.chips.length ? el('div', { class: 'chips', style: 'justify-content:flex-start' }, chipNodes(said.chips)) : null),
        el('div', { class: 'deck-keys' },
          at > 0 ? el('button', { class: 'btn quiet', onclick: back }, icon('back'), 'Back') : null,
          el('span', { class: 'grow' }, at === 0 ? 'Nothing changes until the end.' : ''),
          el('button', { class: 'btn', onclick: () => answer('keep') }, 'Keep', el('kbd', {}, 'K')),
          el('button', { class: 'btn', onclick: () => answer('remove') }, 'Remove', el('kbd', {}, 'R')))));
    }
    // K and R answer, the arrows too, and Backspace goes back. The listener
    // goes when the cards do.
    const keys = event => {
      if (!host.isConnected) {
        document.removeEventListener('keydown', keys);
        return;
      }
      if (event.metaKey || event.ctrlKey || event.altKey || at >= rows.length) return;
      const key = event.key.toLowerCase();
      if (key === 'k' || key === 'arrowleft') answer('keep');
      else if (key === 'r' || key === 'arrowright') answer('remove');
      else if (key === 'backspace' && at > 0) back();
      else return;
      event.preventDefault();
    };
    document.addEventListener('keydown', keys);
    draw();
  }

  // With the wizard out, the cards are on his screen. Without him, a dialog.
  function openDeck() {
    if (state.status !== 'ready') return;
    const rows = state.scan.lists.ask.filter(row => !row.locked);
    if (!rows.length) return;
    if (magic) {
      openWizard({ deck: true });
      return;
    }
    const dialog = document.getElementById('dialog');
    const host = el('div', {});
    dialog.classList.add('wide');
    set(dialog,
      el('div', { class: 'dialog-head' },
        el('h2', {}, 'One at a time'),
        el('p', {}, 'Each of these has a catch. Keep it or remove it; nothing changes until the end.')),
      host);
    dialog.oncancel = null;
    deck(rows, host, {
      cancel: () => dialog.close(),
      done: going => {
        dialog.close();
        act('remove', going.map(row => row.pkg), { undo: going.filter(row => !row.app).map(row => row.pkg) });
      },
    });
    dialog.showModal();
  }

  // ---- A word from the corner ----------------------------------------------

  // On each page the wizard has one thing to say, if there is one worth
  // saying, and the button that does it. Said once: closing it is heard.
  const told = new Set();
  function tipFor(view) {
    const lists = state.scan.lists;
    const n = lists[view] ? lists[view].length : 0;
    const active = (state.scan.installers || []).some(item => item.active);
    if (!n && view !== 'notifying') return null;
    if (view === 'remove') return { text: `Tick what should go, or let me take all ${n} with whatever else can go.`, label: 'Clean up with the wizard', run: () => openWizard() };
    if (view === 'ask') return { text: 'Each of these has a catch. I can show you them one at a time.', label: 'One at a time', run: () => openDeck() };
    if (view === 'pushed') {
      return active ? { text: 'An installer put these here, and it is still on the phone. It goes first, or they come back.', label: 'Clean up with the wizard', run: () => openWizard() }
        : { text: 'Regular apps that an installer put here. Uninstalling one deletes its data.' };
    }
    if (view === 'back') return { text: 'Back again. Whatever reinstalls them is still at work: look under Remove.', label: 'Go to Remove', run: () => go('remove') };
    if (view === 'notifying') return { text: 'Wake the phone to the screen with the junk on it, then scan again. I will name the app behind it.', label: 'Scan again', run: () => scan() };
    if (view === 'unknown') {
      return Number(state.scan.meta.community) ? null
        : { text: 'I do not know these. The community list knows most apps on most phones.', label: 'Get the list', run: () => community(true) };
    }
    if (view === 'off') return { text: 'Anything here can come back: tick it, then Restore.' };
    if (view === 'keep') return { text: 'The phone needs these. I leave them be.' };
    return null;
  }
  function renderTip() {
    const node = document.getElementById('tip');
    const shown = !document.getElementById('pal').hidden && state.status === 'ready' && !told.has(state.view);
    const tip = shown ? tipFor(state.view) : null;
    node.hidden = !tip;
    if (!tip) return;
    const heard = () => {
      told.add(state.view);
      renderTip();
    };
    set(node,
      el('p', {}, tip.text),
      el('button', { class: 'btn quiet small x', 'aria-label': 'Close', onclick: heard }, icon('x', 12)),
      tip.label ? el('button', { class: 'btn small', onclick: () => { heard(); tip.run(); } }, tip.label) : null);
  }

  // ---- Activity ------------------------------------------------------------

  function activityView() {
    const head = el('header', {},
      el('h1', {}, 'Activity'),
      el('p', { class: 'blurb' }, 'Everything this window has asked the phone to do, with the phone\'s own answers. Watch reports each app as it gets installed, and which app installed it.'));

    const tools = el('div', { class: 'toolbar' },
      el('button', { class: 'btn', onclick: inspect, disabled: state.status !== 'ready' }, icon('eye'), 'What is on screen'),
      el('button', { class: 'btn', onclick: toggleWatch, disabled: state.status !== 'ready' && !state.watch },
        icon('radio'), state.watch ? 'Stop watching' : 'Watch installs'),
      el('div', { class: 'grow' }));

    const body = state.log.length === 0
      ? el('div', { class: 'state' },
        icon('activity', 32),
        el('strong', {}, 'Nothing has run yet. Find out which app is drawing on the lock screen.'),
        el('button', { class: 'btn primary', onclick: inspect, disabled: state.status !== 'ready' }, icon('eye'), 'What is on screen'))
      : el('div', {}, state.log.map(entry => el('article', { class: 'entry' },
        el('div', { class: 'entry-head' },
          el('time', { class: 'mono' }, entry.time),
          el('b', {}, entry.title),
          entry.live ? el('span', { class: 'live' }, 'live') : null),
        entry.body ? el('pre', {}, entry.body.trim()) : null)));

    return [head, el('section', { class: 'card' }, tools, body)];
  }

  // ---- Toast and dialog ----------------------------------------------------

  let toastTimer = 0;
  function toast(text, { tone = '', undo = null } = {}) {
    const node = document.getElementById('toast');
    clearTimeout(toastTimer);
    const close = () => {
      node.classList.remove('show');
      document.body.classList.remove('has-toast');
    };
    node.className = `toast show ${tone}`;
    document.body.classList.add('has-toast');
    set(node,
      el('span', {}, text),
      undo ? el('button', { class: 'btn small', onclick: () => { close(); undo(); } }, icon('undo', 12), 'Undo') : null);
    toastTimer = setTimeout(close, undo ? 10000 : 6000);
  }

  function ask({ title, text, yes }) {
    const dialog = document.getElementById('dialog');
    dialog.classList.remove('wide');
    return new Promise(resolve => {
      const done = answer => { dialog.close(); resolve(answer); };
      set(dialog,
        el('div', { class: 'dialog-head' }, el('h2', {}, title), el('p', {}, text)),
        el('div', { class: 'dialog-foot' }, el('div', { class: 'grow' }),
          el('button', { class: 'btn', onclick: () => done(false) }, 'Cancel'),
          el('button', { class: 'btn primary', onclick: () => done(true) }, yes)));
      dialog.oncancel = () => resolve(false);
      dialog.showModal();
    });
  }

  // A closed dialog keeps nothing behind: no stale rows for a screen reader or
  // a search of the page to find.
  document.getElementById('dialog').addEventListener('close', event => {
    event.target.classList.remove('wide');
    event.target.replaceChildren();
  });

  document.getElementById('palette').addEventListener('close', event => event.target.replaceChildren());

  // "/" jumps to the filter; Escape drops the selection.
  document.addEventListener('keydown', event => {
    if (wiz.open) {
      // His screen has the keys while it is up; Escape leaves it.
      if (event.key === 'Escape' && !document.getElementById('dialog').open) closeWizard();
      return;
    }
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      openPalette();
      return;
    }
    const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    const modal = document.getElementById('dialog').open || document.getElementById('palette').open;
    if (state.detail && !modal && !inField) {
      // With an app's details open: Escape closes them, and the arrows
      // move to the app above or below in the list.
      if (event.key === 'Escape') {
        closeDetail();
        return;
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        const shown = visibleRows();
        const at = shown.findIndex(row => row.pkg === state.detail);
        const next = shown[at + (event.key === 'ArrowDown' ? 1 : -1)];
        if (next) {
          event.preventDefault();
          openDetail(next.pkg);
          const node = document.querySelector('.row.open');
          if (node) node.scrollIntoView({ block: 'nearest' });
        }
        return;
      }
    }
    if (event.key === '/' && !inField && ui.search && ui.search.isConnected) {
      event.preventDefault();
      ui.search.focus();
    } else if (event.key === 'Escape' && state.selected.size && !document.getElementById('dialog').open) {
      state.selected.clear();
      paint();
    }
  });

  // The wizard is out unless he was sent away last time.
  let wanted = true;
  try {
    wanted = localStorage.getItem('debloat-magic') !== 'off';
  } catch (e) { /* nothing remembered: he is out */ }
  setMagic(Boolean(engine) && wanted, false);
  if (engine) engine.set({ look: robe });
  document.getElementById('pal').addEventListener('click', openWizard);
  wizBack.addEventListener('click', () => { if (magic) magic.poke(); });
  addEventListener('resize', aim);
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', event => { if (engine) engine.set({ light: event.matches }); });
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', event => { if (engine) engine.set({ still: event.matches }); });

  // Cards on the overview lean towards the pointer.
  const mainNode = document.querySelector('main');
  mainNode.addEventListener('pointermove', event => {
    const card = event.target.closest ? event.target.closest('.tile') : null;
    if (!card || !magic || still()) return;
    const box = card.getBoundingClientRect();
    card.style.setProperty('--ry', `${(((event.clientX - box.left) / box.width - 0.5) * 5).toFixed(2)}deg`);
    card.style.setProperty('--rx', `${(((event.clientY - box.top) / box.height - 0.5) * -5).toFixed(2)}deg`);
  });
  mainNode.addEventListener('pointerout', event => {
    const card = event.target.closest ? event.target.closest('.tile') : null;
    if (!card || card.contains(event.relatedTarget)) return;
    card.style.removeProperty('--rx');
    card.style.removeProperty('--ry');
  });

  render();
  scan();
  oneWindow();
  hold();
  // A second line to the helper, should anything cut the held request short.
  setInterval(() => { api('/api/alive'); }, 5000);
})();
</script>
</body>
</html>
