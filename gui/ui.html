  let magic = null;
  let greeted = false;

  function setMagic(on, remember = true) {
    magic = on ? engine : null;
    if (engine) engine.set({ enabled: on });
    document.body.classList.toggle('no-magic', !magic);
    if (!remember) return;
    try {
      localStorage.setItem('debloat-magic', on ? 'on' : 'off');
    } catch (e) { /* not remembered, then */ }
  }

  // The wizard where the page has no stage for him: at its head, with the
  // one thing he has to say about it beside him. The same two nodes move
  // from page to page.
  const palNode = el('button', { class: 'pal', id: 'pal', 'data-stage': 'side', 'aria-label': 'Clean up with the wizard', onclick: () => openWizard() },
    el('span', { class: 'pal-tip', 'aria-hidden': 'true' }, 'Clean up with the wizard'));
  const tipNode = el('div', { class: 'tip', id: 'tip', role: 'status', hidden: true });
  const says = () => (magic ? el('div', { class: 'says' }, tipNode, palNode) : null);

  // A window onto the wizard and the phone. Pressing him does what it does
  // wherever he is: he comes out. The button beside him says so in words.
  const stage = () => (magic ? el('div', {
    class: 'stage', 'data-stage': 'hero', role: 'img', 'aria-label': 'The wizard, with the phone and what can go circling it',
    title: 'Clean up with the wizard',
    onclick: () => openWizard(),
  }) : null);

  // After every render: what the wizard's world should show for the state
  // the page is in. While his own screen is open, that screen decides.
  function syncMagic() {
    renderTip();
    if (!magic || wiz.open) return;
    if (state.status === 'loading') {
      magic.phone(state.waiting ? 'none' : 'scan');
      magic.act(state.waiting ? 'search' : 'scan');
    } else if (state.status === 'error') {
      // The phone on the stage shows what the real one is waiting for.
      const asking = state.link.kind === 'unauthorized';
      magic.phone(asking ? 'ask' : 'none');
      magic.tiles([]);
      magic.shades(false);
      magic.act(asking ? 'think' : 'search');
    } else {
      const items = cleanup();
      magic.tiles(items.map(tileOf));
      magic.phone(items.length ? 'idle' : 'clean', ...junkOf(items));
      // A clean phone is worth the shades.
      magic.shades(items.length === 0);
      magic.act('idle');
      if (!greeted) {
        greeted = true;
        magic.act('hello');
      }
    }
  }

  // What circles the phone for an app that can go: red for what puts junk
  // back, amber for the rest. Those are the page's own red and amber, and
  // they mean here what they mean there.
  const tileOf = row => ({ id: row.pkg, kind: reinstalls(row.pkg) ? 'installer' : 'remove' });
  // How much of the phone's screen is junk, and how much of that is red.
  const junkOf = items => [items.length / 24, items.filter(row => reinstalls(row.pkg)).length / 24];

  // Lightning for what is about to go: to its rows where a list is showing,
  // and otherwise to what is circling the phone.
  function spell(packages) {
    if (!magic || !magic.visible()) return;
    const asked = new Set(packages);
    const rects = [...document.querySelectorAll('.row[data-pkg]')]
      .filter(node => asked.has(node.dataset.pkg))
      .map(node => node.getBoundingClientRect())
      .filter(rect => rect.bottom > 0 && rect.top < innerHeight);
    if (rects.length) magic.zapRects(rects);
    else magic.zapTiles(packages);
  }

  // ---- Staying in touch with the helper ------------------------------------

  // A helper that does not know this page's token is a newer one at the same
  // address: the app was opened again. Load the page it serves. Once is
  // enough; the note in sessionStorage stops this from ever looping.
  function renew() {
    try {
      if (Date.now() - Number(sessionStorage.getItem('debloat-renewed') || 0) < 15000) return;
      sessionStorage.setItem('debloat-renewed', String(Date.now()));
    } catch (e) { /* no storage here: reload all the same */ }
    location.reload();
  }

  function helperIs(up) {
    if (state.helper === up) return;
    state.helper = up;
    if (!up) {
      state.link = { kind: 'nohelper' };
      fail(GONE);
    } else if (state.status === 'error') scan();
  }

  // One request that never finishes tells the helper this window is open, for
  // as long as it is. A timer would not do: browsers slow the timers of a
  // window nobody is looking at. Its ending is also how this page knows the
  // helper has gone, and says so before anything is clicked.
  async function hold() {
    for (;;) {
      let res = null;
      try {
        res = await fetch('/api/hold', { headers: { 'x-debloat-token': TOKEN } });
      } catch (e) { /* nothing is listening */ }
      if (res && res.status === 401) renew();
      if (res && res.ok) {
        helperIs(true);
        try {
          const reader = res.body.getReader();
          while (!(await reader.read()).done) { /* held open */ }
        } catch (e) { /* cut off */ }
        await sleep(500);
      } else {
        helperIs(false);
        await sleep(2000);
      }
    }
  }

  // Opening the app while a window is already open brings up a new window.
  // The older one steps aside, so there is only ever one to look at. Only a
  // newly opened window announces itself: one that merely reloaded must not
  // close the window the app has just put in front.
  function oneWindow() {
    if (!('BroadcastChannel' in window)) return;
    const born = Date.now() + Math.random();
    const channel = new BroadcastChannel('maxapacity-debloat');
    const leave = () => {
      if (state.pending.size) setTimeout(leave, 500);
      else window.close();
    };
    channel.onmessage = event => {
      if (event.data && event.data.born > born) leave();
    };
    const [arrival] = performance.getEntriesByType('navigation');
    if (!arrival || arrival.type === 'navigate') channel.postMessage({ born });
  }

  function log(title, body, live = false) {
    const entry = { time: clock(), title, body: body || '', live };
    state.log.unshift(entry);
    if (state.log.length > 60) state.log.pop();
    return entry;
  }

  // ---- Talking to the phone ------------------------------------------------

  async function scan({ quiet = false } = {}) {
    if (!quiet) {
      state.status = 'loading';
      state.waiting = '';
      render();
    }
    clearTimeout(looking);
    const found = await api('/api/phones');
    state.link = linkOf(found);
    state.phones = found.phones || [];
    // No phone to scan: say what is in the way, not what the scan would say.
    if (state.link.kind !== 'ready') return fail(state.link.error || LINK_SAYS[state.link.kind]);
    const ready = state.phones.filter(p => p.state === 'device');
    if (!ready.some(p => p.serial === state.serial)) state.serial = ready.length ? ready[0].serial : '';
    loadStuck();

    const result = await api(`/api/scan${query()}`);
    if (!result.ok) return fail(result.error);
    state.scan = result;
    state.status = 'ready';
    state.error = '';
    const here = new Set(rows().map(r => r.pkg));
    for (const pkg of [...state.selected]) if (!here.has(pkg)) state.selected.delete(pkg);
    render();
    return undefined;
  }

  // Apps the phone's maker has locked: asked to go, and Android refused every
  // way of doing it. They are remembered for each phone, so that the cleanup
  // stops offering what it has already been told cannot be done. One that
  // later does go is forgotten.
  const stuckKey = () => `debloat-stuck:${state.serial}`;
  function loadStuck() {
    try {
      state.stuck = new Set(JSON.parse(localStorage.getItem(stuckKey()) || '[]'));
    } catch (e) {
      state.stuck = new Set();
    }
  }
  function noteOutcomes(how) {
    let changed = false;
    for (const [pkg, outcome] of how) {
      if (outcome.said === 'FAILED' && !state.stuck.has(pkg)) {
        state.stuck.add(pkg);
        changed = true;
      } else if (outcome.done && state.stuck.delete(pkg)) changed = true;
    }
    if (!changed) return;
    try {
      localStorage.setItem(stuckKey(), JSON.stringify([...state.stuck]));
    } catch (e) { /* remembered for as long as this window is open, then */ }
  }

  function fail(message) {
    state.status = 'error';
    state.error = message || 'Something went wrong talking to the phone.';
    state.detail = '';
    render();
    watchLink();
  }

  // ---- Getting to the phone ------------------------------------------------

  // What stands between this window and a phone, going by what adb says.
  function linkOf(found) {
    if (!state.helper) return { kind: 'nohelper' };
    if (found.ok === false) return { kind: found.missing === 'adb' ? 'noadb' : 'broken', error: found.error };
    const phones = found.phones || [];
    if (phones.some(p => p.state === 'device')) return { kind: 'ready' };
    if (phones.some(p => p.state === 'unauthorized')) return { kind: 'unauthorized' };
    if (phones.some(p => p.state === 'offline')) return { kind: 'offline' };
    return { kind: 'nophone' };
  }
  const LINK_SAYS = {
    noadb: 'adb is not installed on this computer yet.',
    nophone: 'No phone is answering yet.',
    unauthorized: 'The phone is plugged in and waiting for you to allow this computer.',
    offline: 'The phone is plugged in but not answering.',
    nohelper: GONE,
  };

  // While a phone is being waited for, keep looking, and carry on the moment
  // one answers. A scan that failed with a phone attached is not retried
  // this way: that would be the same failure, over and over.
  let looking = 0;
  function watchLink() {
    clearTimeout(looking);
    if (state.status !== 'error' || state.link.kind === 'ready') return;
    looking = setTimeout(async () => {
      const found = await api('/api/phones');
      if (state.status !== 'error') return;
      const link = linkOf(found);
      if (link.kind === 'ready') {
        if (wiz.open) wizScan();
        else scan();
        return;
      }
      if (link.kind !== state.link.kind) {
        state.link = link;
        state.error = link.error || LINK_SAYS[link.kind];
        render();
        if (wiz.open && wiz.step === 'connect') wizConnect();
      }
      watchLink();
    }, 2500);
  }

  // Where USB debugging is, by who made the phone: how to make Developer
  // options appear, then where the switch is. Checked against each maker's
  // own pages where they have one; the paths move between versions, so each
  // names the older place too.
  const BRANDS = [['pixel', 'Google Pixel'], ['motorola', 'Motorola'], ['samsung', 'Samsung'], ['xiaomi', 'Xiaomi, Redmi, Poco'], ['oneplus', 'OnePlus, Oppo, Realme'], ['other', 'Another maker']];
  const DEBUGGING = {
    pixel: ['Settings > About phone: tap Build number seven times, then enter your PIN.',
      'Settings > System > Developer options: turn on USB debugging.'],
    motorola: ['Settings > About phone: tap Build number seven times, then enter your PIN. On the newest models it is one level down, under Device identifiers.',
      'Settings > System > Developer options: turn on USB debugging.'],
    samsung: ['Settings > About phone > Software information: tap Build number seven times, then enter your PIN.',
      'Settings > Developer options, at the very bottom: turn on USB debugging. If the switch is greyed out, turn off Auto Blocker first, under Settings > Security and privacy.'],
    xiaomi: ['Settings > About phone: tap OS version seven times (MIUI version on older phones).',
      'Settings > Additional settings > Developer options: turn on USB debugging, and USB debugging (Security settings) below it.'],
    oneplus: ['Settings > About device > Version: tap Build number seven times, then enter your PIN. Realme is the same.',
      'Settings > System & update > Developer options: turn on USB debugging. On older versions it is under Additional settings.'],
    other: ['Open Settings and search for Build number, usually under About phone. Tap it seven times, then enter your PIN.',
      'Search Settings for Developer options, and turn on USB debugging there.'],
  };
  // The maker, going by the name of the last phone scanned.
  function brandOf(model) {
    const name = (model || '').toLowerCase();
    if (/pixel/.test(name)) return 'pixel';
    if (/moto|xt\d/.test(name)) return 'motorola';
    if (/^sm-|samsung|galaxy/.test(name)) return 'samsung';
    if (/xiaomi|redmi|poco/.test(name)) return 'xiaomi';
    if (/oneplus|oppo|realme|^cph|^rmx/.test(name)) return 'oneplus';
    return '';
  }
  let brand = '';
  try {
    brand = localStorage.getItem('debloat-brand') || '';
  } catch (e) { /* nothing remembered */ }

  async function copy(text, button) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const box = el('textarea', { style: 'position:fixed;opacity:0' }, text);
      document.body.append(box);
      box.select();
      document.execCommand('copy');
      box.remove();
    }
    if (!button) return;
    const before = [...button.childNodes];
    set(button, icon('check', 16), 'Copied');
    setTimeout(() => set(button, before), 1400);
  }

  // The pictures for getting connected: line drawings in the colour of the
  // words, with the one thing to plug in or tap in the accent.
  const ART = {
    cable: '<rect x="4" y="10" width="24" height="16" rx="2"/><path d="M2 30h28"/><rect x="34" y="16" width="10" height="20" rx="2"/><path class="hot" d="M16 30v6a4 4 0 0 0 4 4h15a4 4 0 0 0 4-4"/>',
    toggle: '<rect x="10" y="3" width="28" height="42" rx="4"/><path d="M15 12h18"/><path d="M15 18h12"/><g class="hot"><rect x="15" y="23" width="18" height="10" rx="5"/><circle cx="28" cy="28" r="2" fill="currentColor"/></g><path d="M15 39h9"/>',
    allow: '<rect x="10" y="3" width="28" height="42" rx="4"/><rect x="13" y="12" width="22" height="24" rx="2"/><path d="M17 17h14"/><path d="M17 21h9"/><path d="M17 31h3"/><rect class="hot" x="23" y="27" width="9" height="6" rx="1.5" fill="currentColor"/>',
  };
  function art(name) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    for (const [k, v] of Object.entries({
      viewBox: '0 0 48 48', width: 72, height: 72, fill: 'none', stroke: 'currentColor',
      'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true',
    })) svg.setAttribute(k, v);
    svg.innerHTML = ART[name];
    return el('div', { class: 'art' }, svg);
  }

  // What stands in the way, in a few words: for the dot beside the phone's
  // name, and the name to show while there is no phone to name.
  const LINK = {
    noadb: { tone: 'warn', status: 'One tool to install first', short: 'A tool is missing', name: 'No phone yet' },
    nophone: { tone: 'warn', status: 'Waiting for a phone', short: 'Waiting for a phone', name: 'No phone yet' },
    unauthorized: { tone: 'warn', status: 'Waiting for you to tap Allow', short: 'Waiting for Allow', name: 'Phone found' },
    offline: { tone: 'warn', status: 'Waiting for the phone to answer', short: 'Not answering', name: 'Phone found' },
    broken: { tone: 'bad', status: 'The tool that reaches the phone is in trouble', short: 'Cannot reach it', name: 'No phone' },
    nohelper: { tone: 'bad', status: 'This window has lost its helper', short: 'Helper stopped', name: 'No phone' },
  };

  // What to do about whatever is in the way: a heading, a line, and the
  // steps, each with its picture. A step the phone is seen to have got past
  // is ticked. The overview and the wizard's own screen both show it.
  function coach() {
    const kind = state.link.kind;
    const command = text => el('div', { class: 'command' }, el('code', { class: 'mono' }, text),
      el('button', { class: 'btn small', onclick: event => copy(text, event.currentTarget) }, icon('copy', 16), 'Copy'));
    const more = (summary, items) => el('details', { class: 'more-help' }, el('summary', {}, summary),
      el('ul', {}, items.map(item => el('li', {}, item))));
    const b = text => el('b', {}, text);
    const p = (...words) => el('p', {}, words);
    // A step that is done keeps its place in the column and gives up its
    // picture: the room is for the step to do now.
    const way = steps => el('ol', { class: 'way' }, steps.map((step, i) => el('li', { class: `way-step${step.state ? ` ${step.state}` : ''}` },
      step.state === 'done' ? el('span', {}) : art(step.art),
      el('div', {},
        el('div', { class: 'way-title' },
          el('span', { class: 'way-num', 'aria-hidden': 'true' }, step.state === 'done' ? icon('check', 16) : i + 1),
          step.title, step.state === 'done' ? el('span', { class: 'sr' }, ' (done)') : null),
        step.text && step.state !== 'done' ? el('div', { class: 'way-text' }, step.text) : null))));
    const said = { ...LINK[kind], body: [] };

    if (kind === 'nohelper') {
      return { ...said, title: 'This window has lost its helper', text: 'Open MAXAPACITY Debloat again. This window reconnects by itself.' };
    }
    if (kind === 'noadb') {
      const mac = /Mac/.test(navigator.platform);
      return {
        ...said,
        title: 'One thing to install first',
        text: 'This app reaches the phone through adb, Android\'s own tool for the job, and it is not on this computer yet.',
        body: [
          el('p', { class: 'coach-label' }, mac
            ? 'Open Terminal: press Command and Space, type Terminal, press Return. Paste this line there and press Return:'
            : 'With your package manager. On Debian or Ubuntu:'),
          command(mac ? 'brew install android-platform-tools' : 'sudo apt install adb'),
          el('p', { class: 'coach-label' }, mac
            ? 'That line uses Homebrew (brew.sh). This window finds adb by itself once it is there.'
            : 'This window finds it by itself once it is there.'),
        ],
      };
    }
    if (kind === 'broken') {
      return { ...said, title: 'adb is having trouble', text: state.link.error || state.error };
    }
    const allow = p('Unlock the phone. It asks ', b('Allow USB debugging?'), ' Tick ', b('Always allow from this computer'), ', then tap ', b('Allow'), '.');
    if (kind === 'unauthorized') {
      return {
        ...said,
        title: 'Tap Allow on the phone',
        text: 'The phone is plugged in, and it is asking whether to trust this computer.',
        body: [
          way([
            { art: 'cable', title: 'The phone is plugged in', state: 'done' },
            { art: 'toggle', title: 'USB debugging is on', state: 'done' },
            { art: 'allow', title: 'Tap Allow on the phone', state: 'now', text: [allow] },
          ]),
          more('No question on the phone\'s screen?', [
            'Unplug the phone and plug it back in.',
            'Still nothing: in Developer options on the phone, tap Revoke USB debugging authorizations, then plug it in again.',
          ]),
        ],
      };
    }
    if (kind === 'offline') {
      return {
        ...said,
        title: 'The phone is not answering',
        text: 'It is plugged in, but it will not talk to this computer yet.',
        body: [way([
          { art: 'cable', title: 'Unplug the phone, then plug it back in', state: 'now', text: [p('Unlock it first. If that changes nothing, restart the phone.')] },
        ])],
      };
    }
    const which = DEBUGGING[brand] ? brand : (brandOf(state.scan && state.scan.meta.phone) || 'other');
    const pick = el('label', { class: 'maker' }, el('span', {}, 'Who made the phone?'),
      el('div', { class: 'select' }, el('select', {
        onchange: event => {
          brand = event.target.value;
          try {
            localStorage.setItem('debloat-brand', brand);
          } catch (e) { /* not remembered, then */ }
          render();
          if (wiz.open && wiz.step === 'connect') wizConnect();
        },
      }, BRANDS.map(([id, label]) => el('option', { value: id, selected: id === which }, label))), icon('more')));
    return {
      ...said,
      title: 'Connect the phone',
      text: 'Three steps, the first time only. After that it is just the cable.',
      body: [
        way([
          { art: 'cable', title: 'Plug the phone into this computer', state: 'now',
            text: [p('Use a cable that carries data: the one that came with the phone is the safe choice. Then unlock the phone.'),
              // Why this step is not ticked off the moment the cable is in.
              p('This window cannot see the phone until step 2 is done, so plugging it in changes nothing here yet.')] },
          { art: 'toggle', title: 'Turn on USB debugging',
            text: [pick, el('ol', { class: 'steps' }, el('li', {}, DEBUGGING[which][0]), el('li', {}, DEBUGGING[which][1]))] },
          { art: 'allow', title: 'Tap Allow on the phone', text: [allow] },
        ]),
        more('Done all that, and still nothing?', [
          'Try another cable. Many only charge.',
          'Plug into the computer itself, not a hub, a dock or a monitor.',
          'On a Mac laptop, say Allow if macOS asks whether the accessory may connect.',
          'Pull down the USB notification on the phone and choose File transfer.',
        ]),
      ],
    };
  }

  function coachCard() {
    const said = coach();
    const staged = Boolean(magic) && state.view === 'overview';
    const waiting = state.link.kind !== 'nohelper';
    return el('section', { class: `card hero coach${staged ? ' staged' : ''}`, role: 'status' },
      el('div', { class: 'hero-main' },
        el('div', {},
          el('div', { class: 'hero-status' }, el('span', { class: `dot ${said.tone}` }), said.status,
            waiting ? el('button', { class: 'btn small', onclick: () => scan() }, icon('refresh', 16), 'Look again') : null),
          el('div', { class: 'hero-number' }, said.title),
          el('p', {}, said.text)),
        said.body.length ? el('div', { class: 'coach-body' }, said.body) : null,
        waiting ? el('p', { class: 'hint' }, 'This window looks again every few seconds, and carries on by itself as soon as the phone answers.') : null),
      staged ? stage() : null);
  }

  // Optimistic: the rows dim at once, the phone's real answer follows, and the
  // toast offers the way back where there is one. "undo" is what the toast's
  // Undo would restore: everything, except an app that was added to the phone
  // later and has now been uninstalled, which nothing here can bring back.
  async function act(action, packages, { undo } = {}) {
    const real = action === 'uninstall' || action === 'cleanup' ? 'remove' : action;
    const back = undo || (real === 'remove' ? packages.filter(pkg => !isApp(pkg)) : packages);
    if (real !== 'restore') spell(packages);
    for (const pkg of packages) state.pending.add(pkg);
    state.selected.clear();
    render();
    const result = await api('/api/act', { method: 'POST', body: { action: real, packages, serial: state.serial } });
    for (const pkg of packages) state.pending.delete(pkg);
    log(action === 'uninstall' ? `Delete ${plural(packages.length, 'app', 'apps')} for good`
      : `${WORDS[action].verb} ${plural(packages.length, 'app', 'apps')}`, result.output || result.error);
    if (real !== 'restore') noteOutcomes(Words.outcomes(result.output, packages));

    await scan({ quiet: true });
    if (!result.ok) {
      if (magic) magic.act('shrug');
      return toast(result.error, { tone: 'bad' });
    }
    const lines = (result.output || '').split('\n');
    const done = lines.find(l => l.startsWith('Done:') || l.startsWith('Nothing was changed')) || 'Done.';
    const changed = done.startsWith('Done:');
    if (changed && real !== 'restore') state.needsRestart = true;
    // In this window's words: the tool says "restored" for what is called
    // putting back here.
    const said = done.replace(/^Done: /, '').replace(/\brestored\b/g, 'put back');
    render();
    return toast(said.charAt(0).toUpperCase() + said.slice(1), {
      tone: result.partial ? 'warn' : '',
      undo: changed && real !== 'restore' && back.length
        ? () => act('restore', back, { undo: [] }) : null,
    });
  }

  // "A", "A and B", "A, B and C", "A, B and 3 more".
  const listOf = names => (names.length > 3 ? `${names.slice(0, 2).join(', ')} and ${names.length - 2} more`
    : names.length > 1 ? `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}` : names[0] || '');

  // Deleting an app that was added to the phone later cannot be undone, so
  // it is always asked about first, by name, whichever way it was asked for.
  function forGood(packages) {
    const one = packages.length === 1;
    return ask({
      title: `Delete ${plural(packages.length, 'app', 'apps')} for good?`,
      text: [
        el('b', {}, listOf(packages.map(pkg => nameOf(pkg)))),
        ` ${one ? 'was' : 'were'} added to the phone after it was made. Deleting ${one ? 'it' : 'them'} also deletes whatever is saved in ${one ? 'it' : 'them'}, and the Play Store is the only way back. `,
        el('span', { class: 'gone' }, 'This cannot be undone.'),
      ],
      yes: `Delete ${packages.length} for good`,
      no: one ? 'Keep it' : 'Keep them',
      risky: true,
    });
  }

  async function restart() {
    const sure = await ask({
      title: 'Restart the phone?',
      text: 'It drops off USB for about a minute. This window scans again by itself once the phone is back.',
      yes: 'Restart',
    });
    if (!sure) return undefined;
    const result = await api(`/api/restart${query()}`, { method: 'POST' });
    log('Restart the phone', result.output || result.error);
    if (!result.ok) return toast(result.error, { tone: 'bad' });
    state.needsRestart = false;
    state.status = 'loading';
    state.waiting = 'Waiting for the phone to come back';
    render();
    await comeBack();
    return scan();
  }

  // Give the phone time to go down, then look for it until it answers again.
  async function comeBack() {
    await sleep(8000);
    for (let i = 0; i < 40; i++) {
      const found = await api('/api/phones');
      if (found.ok !== false && (found.phones || []).some(p => p.state === 'device')) break;
      await sleep(4000);
    }
  }

  async function inspect() {
    const result = await api(`/api/inspect${query()}`);
    log('What is on screen', result.ok ? result.output : result.error);
    render();
  }

  async function toggleWatch() {
    if (state.watch) {
      state.watch.abort();
      return;
    }
    const control = new AbortController();
    state.watch = control;
    const entry = log('Watching for installs', '', true);
    render();
    try {
      const res = await fetch(`/api/watch${query()}`, { headers: { 'x-debloat-token': TOKEN }, signal: control.signal });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        entry.body += decoder.decode(value, { stream: true });
        if (state.view === 'activity') render();
      }
    } catch (e) {
      // Stopped by the button, or the helper went away.
    }
    entry.live = false;
    state.watch = null;
    render();
  }

  // ---- What the scan says --------------------------------------------------

  function rows() {
    if (!state.scan || !state.scan.lists[state.view]) return [];
    return state.scan.lists[state.view];
  }

  function visibleRows() {
    const needle = state.filter.trim().toLowerCase();
    if (!needle) return rows();
    return rows().filter(r => r.pkg.toLowerCase().includes(needle) || r.note.toLowerCase().includes(needle)
      || nameOf(r.pkg).toLowerCase().includes(needle));
  }

  // Everything worth cleaning up, once each: what an installer pushed, what
  // came back, and what the rules mark safe. Regular apps are uninstalled for
  // good; preinstalled ones are removed for this user and can be restored.
  function cleanup() {
    const seen = new Set();
    const out = [];
    for (const list of ['pushed', 'back', 'remove']) {
      for (const row of state.scan.lists[list]) {
        if (seen.has(row.pkg) || row.locked || state.stuck.has(row.pkg)) continue;
        seen.add(row.pkg);
        out.push({ ...row, from: list });
      }
    }
    // What can put apps back goes first, as every page says it does: the
    // phone is asked in this order, and nothing removed can then return
    // while the rest is being removed.
    return [...out.filter(row => reinstalls(row.pkg)), ...out.filter(row => !reinstalls(row.pkg))];
  }
  // How many apps on a page there is something to do about. What the
  // phone's maker has locked is listed on its page, but it is not counted,
  // here or anywhere else a count is given.
  const countOf = id => {
    const list = state.scan.lists[id] || [];
    return ['off', 'keep'].includes(id) ? list.length : list.filter(row => !state.stuck.has(row.pkg)).length;
  };
  // The apps with a catch that can still be gone through.
  const catches = () => state.scan.lists.ask.filter(row => !row.locked && !state.stuck.has(row.pkg));
  // What would be in the cleanup, had the phone's maker not locked it.
  function stuckHere() {
    const seen = new Set();
    for (const list of ['pushed', 'back', 'remove']) {
      for (const row of state.scan.lists[list]) if (state.stuck.has(row.pkg) && !row.locked) seen.add(row.pkg);
    }
    return [...seen];
  }

  // Only a list with something to do in it has boxes to tick, and an app
  // the phone needs has none.
  const selectable = row => Boolean(VIEWS[state.view].primary) && !(row.locked && state.view !== 'off');
  // What the rules say each app is, for the lists that only say how it got
  // here; worked out once for each scan.
  const known = () => {
    if (!state.scan.reasons) state.scan.reasons = Words.reasons(state.scan.lists, state.scan.known);
    return state.scan.reasons;
  };
  // What to call each app, the same wherever it is named.
  const named = () => {
    if (!state.scan.names) state.scan.names = Words.names(state.scan.lists, state.scan.known);
    return state.scan.names;
  };
  const nameOf = pkg => Words.nameOf(pkg, named());
  const sureOf = pkg => Words.sure(pkg, named());
  const describe = (row, list) => Words.describe(row, list, known(), named());
  // Can this one still put apps on the phone?
  const reinstalls = pkg => (state.scan.installers || []).some(item => item.pkg === pkg && item.active);
  // Was this app added to the phone later, rather than coming with it? One
  // that was is uninstalled for good: nothing here can bring it back.
  const isApp = pkg => {
    if (!state.scan.apps) {
      state.scan.apps = new Set(Object.values(state.scan.lists).flat().filter(row => row.app).map(row => row.pkg));
    }
    return state.scan.apps.has(pkg);
  };
  // The picture beside an app's name: what kind of thing it is, where that
  // is known, and otherwise the first letter of whoever it is from. One
  // that can still put apps on the phone is marked in red.
  const appMark = (pkg, text = '') => {
    const hot = reinstalls(pkg);
    const kind = hot ? 'installer' : Words.kindOf(pkg, `${text} ${known().get(pkg) || ''}`);
    return el('span', { class: `app-mark${hot ? ' bad' : ''}`, 'aria-hidden': 'true' }, kind ? icon(PICTURES[kind]) : Words.initial(pkg));
  };
  // An app as a person would name it, beside its picture. The name the
  // phone uses for it is a pointer away, and in the panel a row opens.
  const appCell = (pkg, title, text = '', withPkg = false) => el('div', { class: 'app', title: pkg },
    appMark(pkg, text),
    el('div', { class: 'app-text' }, el('div', { class: `app-name${sureOf(pkg) ? '' : ' guess'}` }, title || nameOf(pkg)), withPkg ? pkgNode(pkg) : null));
  // The same picture at the size of a line of words, for a list of results.
  const appGlyph = (pkg, text = '') => {
    const kind = reinstalls(pkg) ? 'installer' : Words.kindOf(pkg, `${text} ${known().get(pkg) || ''}`);
    return icon(kind ? PICTURES[kind] : 'box');
  };
  // One fact beside a row: the most serious there is. The rest are in the
  // panel the row opens.
  const TONES = { bad: 0, warn: 1 };
  const firstChip = chips => chips.slice().sort((a, b) => (TONES[a.tone] ?? 2) - (TONES[b.tone] ?? 2)).slice(0, 1);
  const chipNodes = chips => chips.map(chip => el('span', { class: `chip${chip.tone ? ` ${chip.tone}` : ''}` }, chip.text));
  // A package name that may break at its dots, never mid-word.
  const pkgNode = name => el('div', { class: 'pkg mono' },
    name.split('.').flatMap((part, i) => (i ? [el('wbr'), `.${part}`] : [part])));
  // A grey bar where words are on their way.
  const bone = (w, h = 12) => el('div', { class: 'bone', style: `width:${w};max-width:100%;height:${h}px` });
  // A number set in the face numbers are set in, with the words after it.
  const counted = (n, words) => [el('span', { class: 'num' }, n), ` ${words}`];

  // A box with more in it than shows says so: how many more rows there are
  // below, or just that there is more, on a strip that brings it up. The
  // strip goes after the box, never over what is in it. Once it has been
  // needed it keeps its place when it has nothing to say, so that nothing
  // under it moves when the end of the list is reached.
  function cue(scroller) {
    const button = el('button', { class: 'btn small' });
    const node = el('div', { class: 'below', hidden: true }, button);
    let last = null;
    const update = () => {
      if (!node.isConnected) return;
      const more = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight > 8;
      const edge = scroller.getBoundingClientRect().bottom;
      const hidden = more ? [...scroller.querySelectorAll('.row')].filter(row => row.getBoundingClientRect().bottom > edge + 4).length : 0;
      const says = !more ? '' : hidden ? `${hidden} more below` : 'More below';
      if (says === last) return;
      last = says;
      node.hidden = !more;
      if (more) {
        node.dataset.kept = '';
        set(button, icon('more', 16), says);
      }
    };
    button.addEventListener('click', () => scroller.scrollBy({ top: scroller.clientHeight * 0.8, behavior: still() ? 'auto' : 'smooth' }));
    scroller.addEventListener('scroll', update, { passive: true });
    if ('ResizeObserver' in window) new ResizeObserver(update).observe(scroller);
    new MutationObserver(update).observe(scroller, { childList: true, subtree: true });
    requestAnimationFrame(update);
    return node;
  }

  // ---- Rendering -----------------------------------------------------------

  function render() {
    // A view that was on its way in has arrived: drawing it again must not
    // send it back to the start.
    document.querySelector('main').classList.remove('enter');
    renderSide();
    renderMain();
    renderBulk();
    renderDetail();
    if (state.scan && state.status === 'ready') state.counted = true;
    syncMagic();
  }

  // Whether the pages under "More" are folded away. They are until asked
  // for, and how they were left is remembered.
  let folded = true;
  try {
    folded = localStorage.getItem('debloat-more') !== 'open';
  } catch (e) { /* folded, then */ }
  function fold(shut) {
    folded = shut;
    try {
      localStorage.setItem('debloat-more', shut ? 'shut' : 'open');
    } catch (e) { /* not remembered, then */ }
  }

  // The wand beside the name sends the wizard away and brings him back. It
  // is easy to press by accident, so it says what it did and how to undo it.
  function toggleWizard() {
    const on = !magic;
    setMagic(on);
    render();
    toast(on ? 'The wizard is back.' : 'The wizard is away. The wand beside the name brings him back.',
      { undo: () => { setMagic(!on); render(); } });
  }

  let navWatch = null;
  function renderSide() {
    const meta = state.scan ? state.scan.meta : null;
    const connected = state.status === 'ready';
    const busy = state.pending.size > 0;
    // What is in the way of a phone, if that is why there is nothing to show.
    const waiting = state.status === 'error' && state.link.kind !== 'ready' ? LINK[state.link.kind] : null;
    // "moto g stylus - 2025 (mona), Android 16" -> the name, then "Android 16"
    const parts = meta ? /^(.*?)(?: \(([^)]*)\))?, (Android .*)$/.exec(meta.phone) : null;
    const model = parts ? parts[1] : (meta ? meta.phone : '');
    const os = parts ? parts[3] : '';
    const ready = state.phones.filter(p => p.state === 'device');
    const name = waiting ? waiting.name : model || (state.status === 'error' ? 'No phone' : 'Looking for a phone');
    const tone = busy ? 'warn' : connected ? 'ok' : waiting ? waiting.tone : state.status === 'error' ? 'bad' : '';
    const says = busy ? 'Working on the phone' : connected ? ['Connected', os ? el('span', { class: 'os' }, ` · ${os}`) : null] : waiting ? waiting.short
      : state.status === 'error' ? 'The scan did not finish' : (state.waiting || 'Scanning');
    const again = connected ? 'Scan again' : 'Look again';
    const mac = /Mac/.test(navigator.platform);

    const phone = el('section', { class: 'phone', 'aria-label': 'Phone' },
      el('div', { class: 'phone-head' },
        icon('phone', 24),
        el('div', { class: 'phone-text' }, el('div', { class: 'phone-name' }, name))),
      el('div', { class: 'status' },
        el('span', { class: `dot ${tone}` }),
        el('span', {}, says),
        el('button', {
          class: 'btn quiet small scan', 'aria-label': again, title: again,
          onclick: () => scan(), disabled: state.status === 'loading' || busy || !state.helper,
        }, icon('refresh'))),
      ready.length > 1 ? el('div', { class: 'select' }, el('select', {
        'aria-label': 'Which phone',
        onchange: e => { state.serial = e.target.value; state.selected.clear(); scan(); },
      }, ready.map(p => el('option', { value: p.serial, selected: p.serial === state.serial }, p.serial))), icon('more')) : null);

    const showCounts = state.scan && state.status !== 'error';
    const count = id => (showCounts && state.scan.lists[id] ? countOf(id) : null);
    const item = id => navItem(id, count(id));
    const nav = el('nav', { 'aria-label': 'Pages' }, NAV.map(group => {
      if (!group.fold) return [group.label ? el('div', { class: 'nav-label' }, group.label) : null, group.items.map(item)];
      return [
        el('button', {
          class: 'nav-item nav-fold', 'aria-expanded': String(!folded),
          onclick: () => {
            fold(!folded);
            renderSide();
            // The line pressed is a new one now: the keyboard stays on it,
            // and the pages it brought out are brought into sight.
            const again = document.querySelector('#side .nav-fold');
            if (again) again.focus({ preventScroll: true });
            const last = document.querySelector('#side nav').lastElementChild;
            if (!folded && last) last.scrollIntoView({ block: 'nearest' });
          },
        }, icon('chevron'), el('span', {}, group.label), el('span', {})),
        folded ? null : group.items.map(item),
      ];
    }));
    // The list of pages scrolls where the window is too short for it. A
    // band lies over whichever end it runs off, and brings the rest up.
    const cueFor = (side, iconName, by, label) => el('button', {
      class: `nav-cue ${side}`, hidden: true, 'aria-label': label, title: label,
      onclick: () => nav.scrollBy({ top: by, behavior: still() ? 'auto' : 'smooth' }),
    }, icon(iconName));
    const up = cueFor('up', 'up-more', -200, 'More pages above');
    const down = cueFor('down', 'more', 200, 'More pages below');
    // Within a few pixels of an end is at it: the box's own padding is not
    // more to see.
    const edges = () => {
      up.hidden = nav.scrollTop <= 8;
      down.hidden = nav.scrollTop + nav.clientHeight >= nav.scrollHeight - 8;
      // A line a band lies partly over is not shown cut through.
      const box = nav.getBoundingClientRect();
      const top = box.top + (up.hidden ? 0 : 36);
      const bottom = box.bottom - (down.hidden ? 0 : 36);
      for (const node of nav.children) {
        const at = node.getBoundingClientRect();
        node.classList.toggle('under', at.top < top - 1 || at.bottom > bottom + 1);
      }
    };
    nav.addEventListener('scroll', edges, { passive: true });

    const before = document.querySelector('#side nav');
    const at = before ? before.scrollTop : 0;
    // Only the top of the sidebar is drawn again: what just happened, at
    // its foot, stays as it is, and is not said twice to a screen reader.
    set(document.getElementById('side-top'),
      el('div', { class: 'brand' },
        el('div', { class: 'brand-mark' }, icon('zap')),
        el('div', {}, el('b', {}, 'MAXAPACITY'), el('span', {}, VERSION ? `Debloat ${VERSION}` : 'Debloat')),
        el('div', { class: 'tools' },
          // One box that finds any app, page or action.
          el('button', {
            class: 'btn quiet small', 'aria-label': 'Find anything', title: `Find anything (${mac ? '⌘K' : 'Ctrl K'})`,
            'aria-keyshortcuts': 'Meta+K Control+K', onclick: openPalette,
          }, icon('search')),
          engine ? el('button', {
            class: 'btn quiet small wand', 'aria-pressed': String(Boolean(magic)), 'aria-label': 'The wizard',
            title: magic ? 'Send the wizard away' : 'Bring the wizard back',
            onclick: toggleWizard,
          }, icon('wand')) : null)),
      phone,
      el('div', { class: 'nav-wrap' }, nav, up, down));
    // Drawn again, it is where it was left.
    nav.scrollTop = at;
    edges();
    requestAnimationFrame(edges);
    // The room the list has changes with the window, and with whatever is
    // said at the foot of the sidebar.
    if (navWatch) navWatch.disconnect();
    if ('ResizeObserver' in window) {
      navWatch = new ResizeObserver(edges);
      navWatch.observe(nav);
    }
  }

  function navItem(id, count) {
    const view = VIEWS[id];
    const badge = el('span', { class: `nav-count num${id === 'back' && count > 0 ? ' warn' : ''}` });
    if (count != null) countUp(badge, count, !state.counted);
    return el('button', {
      class: 'nav-item',
      'aria-current': state.view === id ? 'page' : null,
      onclick: () => go(id),
    }, icon(view.icon), el('span', {}, view.label), count != null ? badge : el('span', {}));
  }

  let arriving = 0;
  function go(id) {
    state.view = id;
    state.selected.clear();
    state.filter = '';
    state.detail = '';
    // A page under "More" brings the rest of them out with it.
    if (folded && NAV.some(group => group.fold && group.items.includes(id))) fold(false);
    // Gone to from the list of pages with the keyboard, the keyboard stays
    // in the list, on the page gone to.
    const active = document.activeElement;
    const fromNav = Boolean(active && active.closest && active.closest('#side nav'));
    render();
    // The page gone to is in sight in the list of pages, wherever that was left.
    const here = document.querySelector('#side nav [aria-current="page"]');
    if (here) here.scrollIntoView({ block: 'nearest' });
    if (here && fromNav) here.focus({ preventScroll: true });
    const main = document.querySelector('main');
    main.scrollTop = 0;
    // It arrives from a little way back; see "enter" in the styles. Once it
    // has, the mark comes off, or rows redrawn by the filter would arrive
    // again at every key.
    void main.offsetWidth;
    main.classList.add('enter');
    clearTimeout(arriving);
    arriving = setTimeout(() => main.classList.remove('enter'), 800);
  }

  function renderMain() {
    const main = document.getElementById('main');
    const view = VIEWS[state.view];
    if (state.view === 'activity') return set(main, activityView());
    if (state.view === 'overview') return set(main, overviewView());

    // The count is beside the name in the sidebar and over the list; here
    // the name alone, so "Remove" does not read as "Remove 7".
    const head = el('header', { class: 'page-head' },
      el('div', {}, el('h1', {}, view.label), el('p', { class: 'blurb' }, view.blurb)), says());
    if (state.status === 'loading') return set(main, head, listSkeleton());
    if (state.status === 'error') return set(main, head, errorCard());
    return set(main, head, listCard(view));
  }

  // ---- Overview ------------------------------------------------------------

  // The outcome first with the one thing to do about it, then what wants
  // attention and what has been done, and the numbers last.
  function overviewView() {
    const head = el('header', {},
      el('h1', {}, 'Overview'),
      el('p', { class: 'blurb' }, 'What is on the phone that should not be, and the quickest way to be rid of it.'));
    if (state.status === 'loading') return [head, overviewSkeleton()];
    if (state.status === 'error') return [head, errorCard()];

    const lists = state.scan.lists;
    const history = state.scan.history;
    const items = cleanup();
    const n = sorts(items);
    const locked = stuckHere();
    const asks = catches().length;

    // The same three sorts, in the same words, as the wizard counts: what
    // puts apps on the phone, what it put there, and the rest of the junk.
    const what = listOf([
      n.installers ? `${plural(n.installers, 'installer that puts', 'installers that put')} apps on the phone by ${n.installers === 1 ? 'itself' : 'themselves'}` : '',
      n.added ? `${plural(n.added, 'app', 'apps')} that an installer put there` : '',
      n.rest ? `${plural(n.rest, 'other piece', 'other pieces')} of junk that came with the phone` : '',
    ].filter(Boolean));
    const hero = el('section', { class: `card hero${magic ? ' staged' : ''}` },
      el('div', { class: 'hero-main' }, el('div', {},
        el('div', { class: 'hero-status' },
          el('span', { class: `dot ${items.length ? 'warn' : 'ok'}` }),
          items.length ? 'Junk found' : 'All clear',
          history.length ? `, scanned at ${at(history[history.length - 1].time)}` : ''),
        el('div', { class: 'hero-number' },
          items.length ? `${plural(items.length, 'thing', 'things')} on this phone can go`
            : locked.length ? 'Everything that can go has gone' : 'This phone is clear of known junk'),
        el('p', {},
          items.length ? `${what.charAt(0).toUpperCase()}${what.slice(1)}.`
            : locked.length ? `${listOf(locked.map(nameOf))} ${locked.length === 1 ? 'is' : 'are'} locked by the phone's maker and ${locked.length === 1 ? 'has' : 'have'} to stay.`
              : 'The installers that put sponsored apps on a phone, the lock screen feeds and the promos are gone, or were never here.',
          lists.back.length ? ` ${lists.back.length} came back after being removed.` : '',
          // With nothing left that can simply go, these are not "more" of it.
          !asks ? '' : items.length ? ` ${plural(asks, 'more comes', 'more come')} with a catch, under With a catch.`
            : ` ${plural(asks, 'app you may not want comes', 'apps you may not want come')} with a catch.`),
        // What the colours beside the wizard mean. The numbers are in the
        // sentence above, counted the one way they are counted everywhere.
        magic && items.length ? el('div', { class: 'legend' },
          n.installers ? el('span', {}, el('i', { class: 'swatch bad', 'aria-hidden': 'true' }), n.installers === 1 ? 'installer' : 'installers') : null,
          n.added + n.rest ? el('span', {}, el('i', { class: 'swatch warn', 'aria-hidden': 'true' }), 'other junk') : null) : null),
      el('div', { class: 'hero-actions' },
        items.length
          ? [magic ? el('button', { class: 'btn primary big', 'data-wizard': true, onclick: openWizard }, icon('wand', 24), 'Clean up with the wizard') : null,
            el('button', { class: magic ? 'btn' : 'btn primary big', onclick: review }, icon('review', magic ? 20 : 24), 'Review cleanup')]
          : [asks ? el('button', { class: 'btn primary big', onclick: () => openDeck() }, icon('layers', 24), `Look at ${asks} with a catch`) : null,
            el('button', { class: asks ? 'btn' : 'btn primary big', onclick: () => scan() }, icon('refresh', asks ? 20 : 24), 'Scan again')],
        // The button and what it is for stay together.
        state.needsRestart
          ? el('span', { class: 'with-hint' }, el('button', { class: 'btn', onclick: restart }, icon('power'), 'Restart phone'),
            el('span', { class: 'hint' }, 'so the lock and home screens catch up'))
          : null)),
      stage());

    return [head, hero, el('div', { class: 'split' }, checksCard(), changesCard()), tiles()];
  }

  // Three numbers. From the second scan on, each says how it moved since the
  // scan before and shows its trend; on the first, what it counts.
  function tiles() {
    const history = state.scan.history;
    const last = history[history.length - 1] || { cleanup: 0, installed: 0, off: 0 };
    // What the maker has locked is still on the phone, and still junk, but
    // it is not something to clean up.
    const now = { ...last, cleanup: Math.max(0, last.cleanup - stuckHere().length) };
    const before = history.length > 1 ? history[history.length - 2] : null;
    const tile = (label, iconName, key, lowerIsBetter, counts) => {
      const value = el('div', { class: 'tile-value' });
      countUp(value, now[key], !state.counted);
      let delta = null;
      let caption = counts;
      if (before) {
        const diff = now[key] - before[key];
        const pct = before[key] ? Math.round(Math.abs(diff) / before[key] * 100) : null;
        const tone = diff === 0 || lowerIsBetter == null ? '' : ((diff < 0) === lowerIsBetter ? ' good' : ' bad');
        delta = el('span', { class: `delta${tone}` },
          icon(diff === 0 ? 'flat' : diff < 0 ? 'down' : 'up', 16),
          diff === 0 ? '0%' : pct == null ? 'new' : `${pct}%`);
        caption = `was ${before[key]} at ${at(before.time)}`;
      }
      return el('section', { class: 'card tile' },
        el('div', { class: 'tile-label' }, icon(iconName, 16), label),
        el('div', { class: 'tile-main' }, value, before ? sparkline(history.map(h => h[key])) : null),
        el('div', { class: 'tile-foot' }, delta, el('span', {}, caption)));
    };
    return el('div', { class: 'tiles' },
      tile('To clean up', 'trash', 'cleanup', true, 'everything that can go, counted once'),
      tile('Apps on the phone', 'box', 'installed', true, 'built in or added, all of them'),
      tile('Off or removed', 'off', 'off', null, 'by this app or by anything else'));
  }

  // A plain line, no fill: the shape of the last scans, newest at the right.
  function sparkline(values) {
    const w = 96;
    const h = 28;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    for (const [k, v] of Object.entries({ viewBox: `0 0 ${w} ${h}`, width: w, height: h, class: 'spark', 'aria-hidden': 'true' })) {
      svg.setAttribute(k, v);
    }
    const points = values.slice(-24);
    if (points.length < 2) return svg;
    const min = Math.min(...points);
    const max = Math.max(...points);
    const xy = points.map((v, i) => [
      2 + i * (w - 4) / (points.length - 1),
      max === min ? h / 2 : 3 + (h - 6) * (1 - (v - min) / (max - min)),
    ]);
    const line = xy.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const [lx, ly] = xy[xy.length - 1];
    svg.innerHTML = `<polyline points="${line}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2" fill="currentColor"/>`;
    return svg;
  }

  // The state of the phone as a short list: what is wrong, what is fine,
  // and beside each thing that is wrong the one thing to do about it.
  function checksCard() {
    const lists = state.scan.lists;
    const installers = state.scan.installers || [];
    const active = installers.filter(item => item.active);
    const listed = Number(state.scan.meta.community) || 0;
    const asks = catches().length;
    const names = listOf([...new Set(active.map(item => Words.vendorOf(item.pkg) || nameOf(item.pkg)))]);
    const check = (tone, title, detail, action) => el('div', { class: 'check' },
      el('span', { class: `check-mark ${tone}` }, icon({ ok: 'check', bad: 'alert', warn: 'alert', note: 'info' }[tone])),
      el('div', { class: 'check-text' }, el('div', {}, title), detail ? el('div', { class: 'check-detail' }, detail) : null),
      action || el('span', {}));
    const button = (label, run, iconName) => el('button', { class: 'btn small', onclick: run, disabled: state.pending.size > 0 },
      icon(iconName, 16), label);
    const out = [];

    if (active.length) {
      out.push(check('bad', `${plural(active.length, 'installer', 'installers')} can still put apps back`,
        `${names}. Until ${active.length === 1 ? 'it goes' : 'they go'}, what you remove can return.`,
        button('Clean up', magic ? openWizard : review, magic ? 'wand' : 'review')));
    } else if (installers.length) {
      out.push(check('ok', 'Nothing can put apps back',
        `${plural(installers.length, 'installer was', 'installers were')} on this phone, and ${installers.length === 1 ? 'is' : 'are'} out of the way.`));
    } else {
      out.push(check('ok', 'No installer here', 'Nothing on this phone puts apps on it behind your back, as far as this app knows.'));
    }
    if (lists.back.length) {
      out.push(check('bad', `${plural(lists.back.length, 'removed app is', 'removed apps are')} back`,
        'An installer or a system update brought it back.', button('See', () => go('back'), 'next')));
    } else if (state.scan.changes.length) {
      out.push(check('ok', 'Nothing you removed has come back'));
    }
    const locked = stuckHere();
    if (locked.length) {
      out.push(check('note', `${plural(locked.length, 'app is', 'apps are')} locked by the phone's maker`,
        `${listOf(locked.map(nameOf))}. Android would not remove, switch off or silence ${locked.length === 1 ? 'it' : 'them'}, so ${locked.length === 1 ? 'it stays' : 'they stay'}.`));
    }
    if (state.needsRestart) {
      out.push(check('warn', 'The phone wants a restart', 'So that its lock and home screens catch up.', button('Restart', restart, 'power')));
    }
    if (asks) {
      out.push(check('note', `${plural(asks, 'app comes', 'apps come')} with a catch`,
        'Go through them one at a time, and keep what you use.', button('One at a time', () => openDeck(), 'layers')));
    }
    if (lists.unknown.length) {
      out.push(check('note', `Nothing is known about ${plural(lists.unknown.length, 'app', 'apps')}`,
        listed ? 'The community list says what it can about them.' : 'The community list describes most apps on most phones.',
        listed ? button('See', () => go('unknown'), 'next') : button('Get the list', () => community(true), 'users')));
    }
    if (lists.notifying.length) {
      out.push(check('note', `${plural(lists.notifying.length, 'app had', 'apps had')} a notification showing`,
        'When the phone was last scanned.', button('See', () => go('notifying'), 'next')));
    }
    return el('section', { class: 'card' }, el('div', { class: 'card-head' }, el('h2', {}, 'Checks')), out);
  }

  // The community list: fetch it, or stop using it, and scan again either
  // way. It is one download, from the project that keeps the list.
  async function community(on) {
    toast(on ? 'Fetching the community list.' : 'Dropping the community list.');
    const result = await api('/api/community', { method: 'POST', body: { on } });
    log(on ? 'Get the community list' : 'Stop using the community list', result.output || result.error);
    if (!result.ok) return toast(result.error, { tone: 'bad' });
    await scan({ quiet: true });
    const n = Number(state.scan && state.scan.meta.community) || 0;
    return toast(on ? `The community list is in use: ${n} apps described. What it recommends removing is under With a catch.`
      : 'The community list is no longer used.', { undo: on ? () => community(false) : null });
  }

  function changesCard() {

  function listCard(view) {
    if (rows().length === 0) {

          icon('done', 40),
