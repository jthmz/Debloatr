  // Redraws the rows and counts without touching the filter box, so typing in
  // it keeps its focus.
  function paint() {
    const view = VIEWS[state.view];
    if (!view.blurb || state.status !== 'ready' || !ui.rows || rows().length === 0) return renderBulk();
    const shown = visibleRows();
    const pickable = shown.filter(selectable);
    const picked = pickable.filter(r => state.selected.has(r.pkg)).length;

    if (ui.all) {
      ui.all.checked = pickable.length > 0 && picked === pickable.length;
      ui.all.indeterminate = picked > 0 && picked < pickable.length;
      ui.all.disabled = pickable.length === 0;
    }
    set(ui.count, shown.length === rows().length
      ? counted(shown.length, 'in this list')
      : [el('span', { class: 'mono' }, shown.length), ' of ', el('span', { class: 'mono' }, rows().length), ' shown']);

    if (shown.length === 0) {
      set(ui.rows, el('div', { class: 'state' },
        icon('search', 40),
        el('strong', {}, 'Nothing in this list matches that filter.'),
        el('button', { class: 'btn', onclick: () => { state.filter = ''; ui.search.value = ''; paint(); } }, 'Clear the filter')));
    } else {
      set(ui.rows, shown.map((row, i) => rowNode(row, view, i)));
    }
    renderTip();
    return renderBulk();
  }

  function rowNode(row, view, index) {
    const can = selectable(row);
    const said = describe(row, state.view);
    const chips = said.chips.slice();
    if (state.view !== 'off' && reinstalls(row.pkg)) chips.unshift({ text: 'puts apps back', tone: 'bad' });

    const toggle = () => {
      if (state.selected.has(row.pkg)) state.selected.delete(row.pkg);
      else state.selected.add(row.pkg);
      paint();
    };
    // The row opens everything known about the app, in every list. Only
    // its box ticks it, and the box has room around it to be hit.
    return el('div', {
      class: `row${state.selected.has(row.pkg) ? ' selected' : ''}${state.pending.has(row.pkg) ? ' pending' : ''}${state.detail === row.pkg ? ' open' : ''}`,
      'data-pkg': row.pkg, style: `--i:${index}`,
      onclick: () => openDetail(row.pkg),
    },
    !view.primary ? null : can ? el('label', { class: 'pick', onclick: event => event.stopPropagation() },
      el('input', { type: 'checkbox', checked: state.selected.has(row.pkg), 'aria-label': `Select ${said.title}`, onchange: toggle }))
      : el('span', {}),
    appCell(row.pkg, said.title, said.about),
    el('div', { class: 'note', title: said.about }, said.about),
    el('div', { class: 'chips' }, chipNodes(state.pending.has(row.pkg) ? [{ text: 'working' }] : firstChip(chips))),
    el('button', {
      class: 'btn quiet small more', 'aria-label': `About ${said.title}`,
      onclick: event => { event.stopPropagation(); openDetail(row.pkg); },
    }, icon('chevron')));
  }

  function toggleAll(event) {
    for (const row of visibleRows().filter(selectable)) {
      if (event.target.checked) state.selected.add(row.pkg);
      else state.selected.delete(row.pkg);
    }
    paint();
  }

  // The actions for a selection: they appear only once there is one.
  function renderBulk() {
    const bar = document.getElementById('bulk');
    const view = VIEWS[state.view];
    const n = state.selected.size;
    const show = n > 0 && state.status === 'ready' && Boolean(view.primary);
    bar.classList.toggle('show', show);
    document.body.classList.toggle('has-bulk', show);
    if (!show) return;
    const button = (action, primary) => el('button', {
      class: `btn${primary ? ' primary' : ''}`,
      disabled: state.pending.size > 0,
      onclick: () => run(action),
    }, icon(WORDS[action].icon), primary ? `${WORDS[action].verb} ${n}` : WORDS[action].verb);
    set(bar,
      el('span', { class: 'n' }, counted(n, 'selected')),
      el('button', { class: 'btn quiet', onclick: () => { state.selected.clear(); paint(); } }, icon('x'), 'Clear'),
      el('span', { class: 'sep' }),
      view.secondary ? button(view.secondary, false) : null,
      button(view.primary, true));
  }

  // Whatever list it is asked from, removing an app that was added to the
  // phone later is an uninstall, and is asked about first.
  async function run(action) {
    const packages = [...state.selected];
    if (packages.length === 0) return;
    const final = action === 'remove' || action === 'uninstall' ? packages.filter(isApp) : [];
    if (final.length && !(await forGood(final))) return;
    await act(action, packages);
  }

  // ---- Review before cleaning ----------------------------------------------

  // What a cleanup would do, in words: the part that cannot be undone
  // first, and in red.
  function cleanupSays(apps, system) {
    if (!apps && !system) return ['Nothing is ticked.'];
    return [
      apps ? el('span', { class: 'gone' }, `Uninstalls ${apps} for good`) : null,
      apps && system ? ', and ' : null,
      system ? `${apps ? 'removes' : 'Removes'} ${system}, which can be undone` : null,
      '.',
    ];
  }
  // The button says the same thing, shorter.
  const cleanupLabel = (apps, system) => (apps && system ? `Uninstall ${apps} and remove ${system}`
    : apps ? `Uninstall ${apps}` : system ? `Remove ${system}` : 'Nothing ticked');

  // What can go, in two groups by whether it can be undone, each with a box
  // that ticks the lot. `picked` is the set being chosen; `changed` hears of
  // every tick. Returns the rows and a function that draws them again.
  function checklist(items, picked, { changed = () => {}, hover = null } = {}) {
    const groups = [
      { title: 'Uninstall', final: true, rows: items.filter(row => row.app) },
      { title: 'Remove', rows: items.filter(row => !row.app) },
    ].filter(group => group.rows.length);
    const node = el('div', {});
    const draw = () => {
      set(node, groups.map(group => {
        const mine = group.rows.filter(row => picked.has(row.pkg)).length;
        const all = el('input', {
          type: 'checkbox', 'aria-label': `Select all under ${group.title}`,
          onchange: event => {
            for (const row of group.rows) {
              if (event.target.checked) picked.add(row.pkg);
              else picked.delete(row.pkg);
              changed(row);
            }
            draw();
          },
        });
        all.checked = mine === group.rows.length;
        all.indeterminate = mine > 0 && mine < group.rows.length;
        return [
          el('div', { class: 'group-head' }, el('label', { class: 'pick' }, all), el('b', {}, group.title),
            el('span', {}, counted(mine, `of ${group.rows.length}`)),
            el('span', { class: 'grow' }),
            group.final ? el('span', { class: 'chip bad' }, 'Cannot be undone') : el('span', {}, 'Can be undone')),
          group.rows.map(row => {
            const flip = () => {
              if (picked.has(row.pkg)) picked.delete(row.pkg);
              else picked.add(row.pkg);
              changed(row);
              draw();
            };
            const said = describe(row, row.from);
            // In a list to tick through, the whole row is the box.
            return el('div', {
              class: `row${picked.has(row.pkg) ? ' selected' : ''}`, onclick: flip,
              onpointerenter: hover ? () => hover(row, true) : null,
              onpointerleave: hover ? () => hover(row, false) : null,
            },
            el('label', { class: 'pick', onclick: event => event.stopPropagation() },
              el('input', { type: 'checkbox', checked: picked.has(row.pkg), 'aria-label': `Select ${said.title}`, onchange: flip })),
            appCell(row.pkg, said.title, said.about),
            el('div', { class: 'note', title: said.about }, said.about));
          }),
        ];
      }));
      changed(null);
    };
    return { node, draw };
  }

  // Everything the cleanup would do, ticked. Untick to keep; nothing
  // happens until the button is pressed, and what cannot be undone is asked
  // about once more.
  function review() {
    const items = cleanup();
    const picked = new Set(items.map(r => r.pkg));
    const dialog = document.getElementById('dialog');
    const summary = el('div', { class: 'grow' });
    const confirm = el('button', { class: 'btn primary' });
    const count = () => {
      const apps = items.filter(r => r.app && picked.has(r.pkg)).length;
      return [apps, picked.size - apps];
    };
    const list = checklist(items, picked, {
      changed: row => {
        if (row) return;
        const [apps, system] = count();
        set(summary, cleanupSays(apps, system));
        set(confirm, icon('trash'), cleanupLabel(apps, system));
        confirm.disabled = picked.size === 0;
      },
    });
    const body = el('div', { class: 'dialog-body' }, list.node);
    body.append(cue(body));
    const show = () => {
      dialog.classList.add('wide');
      set(dialog,
        el('div', { class: 'dialog-head' },
          el('h2', {}, 'Review cleanup'),
          el('p', {}, 'Everything below is ticked. Untick anything you want to keep.')),
        body,
        el('div', { class: 'dialog-foot' }, summary,
          el('div', { class: 'acts' }, el('button', { class: 'btn', onclick: () => dialog.close() }, 'Cancel'), confirm)));
      dialog.oncancel = null;
      list.draw();
    };

    confirm.onclick = async () => {
      const chosen = items.filter(r => picked.has(r.pkg));
      const final = chosen.filter(r => r.app).map(r => r.pkg);
      if (final.length && !(await forGood(final))) {
        // Not sure after all: back to the list, as it was left.
        show();
        return;
      }
      dialog.close();
      await act('cleanup', chosen.map(r => r.pkg));
    };
    show();
    dialog.showModal();
  }

  // ---- The wizard ----------------------------------------------------------

  // The same cleanup as "Review as a list", walked through a step at a time
  // by the wizard on a screen of his own: find the phone, scan it, choose
  // what goes, clean up, and see what happened. It asks the helper for
  // exactly what the list asks for. The show is drawn from the answers: the
  // lightning falls only on what the phone says is gone.
  const STEPS = [['connect', 'Phone'], ['scan', 'Scan'], ['choose', 'Choose'], ['cast', 'Clean up'], ['done', 'Done']];
  const wiz = { open: false, run: 0, step: '', busy: false, items: [], picked: new Set() };
  const wizNode = document.getElementById('wiz');
  const wizBack = document.getElementById('wiz-back');
  const BEHIND = ['side', 'bulk', 'toast'];
  let typing = 0;

  // His line appears as he says it. The whole of it is there from the
  // start, unseen, so that nothing below it moves as the words arrive. A
  // screen reader gets it whole.
  function say(node, text) {
    typing += 1;
    const mine = typing;
    if (still() || !magic) {
      node.textContent = text;
      return;
    }
    const said = el('span', {});
    const rest = el('span', { style: 'visibility:hidden' }, text);
    set(node, said, rest);
    let shown = 0;
    magic.talking(true);
    const more = () => {
      if (mine !== typing) return;
      shown += 2;
      said.textContent = text.slice(0, shown);
      rest.textContent = text.slice(shown);
      if (shown < text.length) setTimeout(more, 22);
      else magic.talking(false);
    };
    more();
  }

  // One screen of his: where in the steps it is, what he says, what is under
  // that, and the buttons. A foot with nothing in it is not drawn.
  function wizShow({ step, line, sub = '', notes = null, body = null, note = '', buttons = [] }) {
    wiz.step = step;
    const at = STEPS.findIndex(([id]) => id === step);
    const lineNode = el('p', { class: 'wiz-line', 'aria-hidden': 'true' });
    const scroller = el('div', { class: 'wiz-body' }, body);
    if (body) scroller.append(cue(scroller));
    const foot = note || buttons.length ? el('div', { class: 'wiz-foot' }, el('div', { class: 'grow' }, note), el('div', { class: 'acts' }, buttons)) : null;
    set(wizNode,
      el('div', { class: 'wiz-top' },
        el('ol', { class: 'wiz-steps', 'aria-label': 'Steps' }, STEPS.map(([, label], i) => el('li', {
          class: i < at ? 'done' : i === at ? 'now' : null, 'aria-current': i === at ? 'step' : null,
        }, label))),
        el('button', { class: 'btn quiet small', onclick: closeWizard, disabled: wiz.busy, 'aria-label': 'Leave the wizard' },
          icon('x', 16), 'Close')),
      el('div', { class: 'wiz-say' },
        lineNode,
        el('p', { class: 'sr', role: 'status' }, line),
        sub ? el('p', { class: 'wiz-sub' }, sub) : null,
        notes),
      scroller,
      foot);
    say(lineNode, line);
    const first = wizNode.querySelector('.wiz-foot .btn.primary:not(:disabled)') || wizNode.querySelector('.wiz-top .btn:not(:disabled)');
    if (first) first.focus({ preventScroll: true });
  }

  // Where on his screen he and the phone stand: beside the pane, or above it
  // when the window is too narrow for both.
  function aim() {
    if (!wiz.open) return;
    const beside = wizNode.offsetLeft > innerWidth * 0.3;
    wizBack.dataset.into = beside
      ? `0.02 0.08 ${((wizNode.offsetLeft - 16) / innerWidth).toFixed(3)} 0.96`
      : `0.04 0.03 0.96 ${((wizNode.offsetTop - 8) / innerHeight).toFixed(3)}`;
  }

  function openWizard(options) {
    if (wiz.open || !magic) return;
    const dialog = document.getElementById('dialog');
    if (dialog.open) dialog.close();
    wiz.open = true;
    wiz.run += 1;
    // Asked for the apps with a catch, he goes straight to those.
    wiz.deck = Boolean(options && options.deck === true);
    state.detail = '';
    renderDetail();
    for (const id of BEHIND) document.getElementById(id).inert = true;
    document.querySelector('main').inert = true;
    wizBack.hidden = false;
    wizBack.dataset.stage = 'full';
    wizNode.hidden = false;
    aim();
    syncMagic();
    magic.shades(false);
    magic.act('hello');
    // He comes out with a turn on the spot, once his own screen is up.
    const run = wiz.run;
    setTimeout(() => { if (magic && wiz.open && run === wiz.run) magic.poke(); }, 140);
    wizScan();
  }

  function closeWizard() {
    if (!wiz.open || wiz.busy) return;
    wiz.open = false;
    wiz.run += 1;
    typing += 1;
    if (magic) magic.talking(false);
    wizBack.hidden = true;
    delete wizBack.dataset.stage;
    wizNode.hidden = true;
    wizNode.replaceChildren();
    for (const id of BEHIND) document.getElementById(id).inert = false;
    document.querySelector('main').inert = false;
    render();
    const back = document.querySelector('[data-wizard]') || palNode;
    if (back.isConnected) back.focus({ preventScroll: true });
  }

  // No way to the phone yet: the same walk-through as the overview gives,
  // in his words, with the phone beside him showing what it is waiting
  // for. The page keeps looking (watchLink) and brings him on when one
  // answers.
  function wizConnect() {
    const kind = state.link.kind;
    if (kind === 'ready') {
      // A phone is there and the scan still failed: say what it said.
      magic.act('idle');
      magic.act('shrug');
      return wizShow({
        step: 'scan',
        line: 'The scan did not finish.',
        sub: state.error,
        buttons: [el('button', { class: 'btn primary', onclick: wizScan }, icon('refresh'), 'Try again')],
      });
    }
    const said = coach();
    const asking = kind === 'unauthorized';
    magic.tiles([]);
    magic.phone(asking ? 'ask' : 'none');
    magic.shades(false);
    magic.act(asking ? 'think' : 'search');
    wizShow({
      step: 'connect',
      line: {
        nophone: 'I cannot see a phone yet.',
        unauthorized: 'I can see it. It wants your say-so.',
        offline: 'It is there, but it will not answer.',
        noadb: 'I am missing a tool.',
        broken: 'Something is wrong with adb.',
        nohelper: 'I have lost my helper.',
      }[kind],
      sub: said.text,
      body: said.body.length ? el('div', { class: 'wiz-coach' }, el('div', { class: 'coach-body' }, said.body)) : null,
      note: kind === 'nohelper' ? '' : 'I look again every few seconds.',
      buttons: kind === 'nohelper' ? [] : [el('button', { class: 'btn primary', onclick: wizScan }, icon('refresh'), 'Look again')],
    });
    return watchLink();
  }

  async function wizScan() {
    const run = wiz.run;
    magic.tiles([]);
    magic.phone('scan');
    magic.shades(false);
    magic.act('scan');
    wizShow({
      step: 'scan',
      line: 'Hold still. I am looking inside.',
      sub: 'Reading what is on the phone, and how each thing got there. Nothing changes yet.',
      // Where the three numbers will be.
      body: el('div', { class: 'wiz-stats', 'aria-busy': 'true', 'aria-label': 'Scanning the phone' },
        [0, 1, 2].map(() => el('div', { class: 'wiz-stat' }, bone('56px', 28), bone('80%')))),
    });
    // Long enough for the words to be read, however quick the phone is.
    await Promise.all([scan({ quiet: true }), sleep(still() ? 0 : 600)]);
    if (run !== wiz.run) return undefined;
    if (state.status !== 'ready') return wizConnect();
    wiz.items = cleanup();
    wiz.picked = new Set(wiz.items.map(row => row.pkg));
    if (wiz.deck) {
      wiz.deck = false;
      return wizDeck();
    }
    return wizFound();
  }

  // The apps with a catch, on his screen, one to a card. The one being
  // asked about lights up beside the phone; the ones kept drift off.
  function wizDeck() {
    const rows = state.scan.lists.ask.filter(row => !row.locked);
    if (!rows.length) return wizFound();
    const host = el('div', {});
    magic.tiles(rows.map(row => ({ id: row.pkg, kind: 'ask' })));
    magic.phone('idle');
    magic.shades(false);
    magic.act('think');
    wizShow({
      step: 'choose',
      line: rows.length === 1 ? 'This one comes with a catch.' : `These ${rows.length} each come with a catch.`,
      sub: 'One at a time: keep it, or remove it. Nothing changes until the end.',
      body: host,
    });
    deck(rows, host, {
      show: (row, choice) => {
        for (const each of rows) {
          magic.tile(each.pkg, row && each.pkg === row.pkg ? 'aim' : choice.get(each.pkg) === 'keep' ? 'keep' : 'orbit');
        }
      },
      cancel: () => (cleanup().length ? wizFound() : closeWizard()),
      done: going => wizCast(going, rows),
    });
    return undefined;
  }

  // What the scan found. Each thing that can go is now circling the phone,
  // red if it is an installer, amber if not, and the numbers say so.
  function wizFound() {
    const items = wiz.items;
    const asks = state.scan.lists.ask.filter(row => !row.locked).length;
    const hot = items.filter(row => reinstalls(row.pkg)).length;
    const stat = (n, label, tone) => el('div', { class: 'wiz-stat' },
      el('b', {}, tone ? el('i', { class: `swatch ${tone}`, 'aria-hidden': 'true' }) : null, n), el('span', {}, label));
    const stats = el('div', { class: 'wiz-stats' },
      stat(hot, hot === 1 ? 'installer: it puts apps on the phone by itself' : 'installers: they put apps on the phone by themselves', 'bad'),
      stat(items.length - hot, 'other things that can go', 'warn'),
      stat(asks, 'with a catch, for afterwards'));
    const later = asks
      ? ` ${plural(asks, 'more comes', 'more come')} with a catch; we can go through ${asks === 1 ? 'it' : 'them'} afterwards.`
      : '';
    magic.tiles(items.map(row => ({ ...tileOf(row), state: wiz.picked.has(row.pkg) ? 'orbit' : 'keep' })));
    magic.phone(items.length ? 'idle' : 'clean', ...junkOf(items));
    magic.shades(items.length === 0);
    magic.act(items.length ? 'think' : 'cool');
    if (!items.length) {
      return wizShow({
        step: 'scan',
        line: 'Spotless. Nothing here I would send away.',
        sub: `The installers that put sponsored apps on a phone, the lock screen feeds and the promos are gone, or were never here.${later}`,
        body: stats,
        buttons: asks
          ? [el('button', { class: 'btn', onclick: closeWizard }, 'Close'),
            el('button', { class: 'btn primary', onclick: wizDeck }, icon('layers'), `Go through ${asks}`)]
          : [el('button', { class: 'btn primary', onclick: closeWizard }, 'Close')],
      });
    }
    return wizShow({
      step: 'scan',
      line: `${plural(items.length, 'thing', 'things')} on this phone ${items.length === 1 ? 'does' : 'do'} not belong.`,
      sub: `That is ${items.length === 1 ? 'it' : 'them'}, circling the phone.${hot ? ` The red ${hot === 1 ? 'one goes' : 'ones go'} first, or the rest come back.` : ''}${later}`,
      body: stats,
      note: 'Nothing changes until you say so.',
      buttons: [el('button', { class: 'btn primary', onclick: wizChoose }, 'Choose what goes', icon('next'))],
    });
  }

  // Everything ticked, in two groups by whether it can be undone, as in the
  // list. What is unticked drifts away from the phone and cools.
  function wizChoose() {
    const items = wiz.items;
    const picked = wiz.picked;
    const note = el('span', {});
    const count = () => {
      const apps = items.filter(row => row.app && picked.has(row.pkg)).length;
      return [apps, picked.size - apps];
    };
    const go = el('button', {
      class: 'btn primary',
      onclick: async () => {
        // What cannot be undone is asked about once more, by name.
        const final = items.filter(row => row.app && picked.has(row.pkg)).map(row => row.pkg);
        if (final.length && !(await forGood(final))) return;
        wizCast();
      },
    });
    const mark = row => magic.tile(row.pkg, picked.has(row.pkg) ? 'orbit' : 'keep');
    const list = checklist(items, picked, {
      changed: row => {
        if (row) return mark(row);
        const [apps, system] = count();
        set(note, cleanupSays(apps, system));
        set(go, icon('trash'), cleanupLabel(apps, system));
        go.disabled = picked.size === 0;
        return undefined;
      },
      // Pointing at a row lights up the one it means.
      hover: (row, over) => { if (over && picked.has(row.pkg)) magic.tile(row.pkg, 'aim'); else mark(row); },
    });

    magic.act('idle');
    wizShow({
      step: 'choose',
      line: 'Untick anything you would rather keep.',
      sub: 'What came with the phone can be brought back later. What was added to it afterwards cannot.',
      body: list.node,
      note,
      buttons: [el('button', { class: 'btn', onclick: wizFound }, icon('back'), 'Back'), go],
    });
    list.draw();
  }

  // What the tool said it did to an app, as a chip.
  function outcomeChip(how, pkg) {
    const said = how.has(pkg) ? how.get(pkg).said : 'no answer';
    const tone = !(how.has(pkg) && how.get(pkg).done) ? ' bad' : /^(removed|uninstalled)$/.test(said) ? ' ok' : ' warn';
    return el('span', { class: `chip${tone}` }, said === 'FAILED' ? 'locked by the maker' : said);
  }

  // `chosen` is what goes, out of `all` that are circling the phone: the
  // ticked ones from the cleanup, or the ones marked on the cards.
  async function wizCast(chosen = wiz.items.filter(row => wiz.picked.has(row.pkg)), all = wiz.items) {
    if (!chosen.length || wiz.busy) return undefined;
    const packages = chosen.map(row => row.pkg);
    const going = new Set(packages);
    wiz.busy = true;
    for (const row of all) magic.tile(row.pkg, going.has(row.pkg) ? 'aim' : 'keep');
    magic.act('channel');
    // Each app has a line, and each line gets its answer as the lightning
    // reaches it. Until the phone has answered there is only the bar.
    const pills = new Map();
    // What each app is, kept from before it goes: once it has gone, the scan
    // has nothing to say about it, and its picture would be lost.
    const texts = new Map(chosen.map(row => [row.pkg, `${describe(row, row.from || 'ask').about} ${known().get(row.pkg) || ''}`]));
    const cell = row => appCell(row.pkg, '', texts.get(row.pkg));
    const bar = el('div', { class: 'working', role: 'progressbar', 'aria-label': 'Waiting for the phone' }, el('i'));
    wizShow({
      step: 'cast',
      line: 'Stand back.',
      sub: `Asking the phone to let go of ${plural(packages.length, 'app', 'apps')}. Leave it plugged in until I am done.`,
      body: el('div', {}, bar, chosen.map(row => {
        const pill = el('span', { class: 'chip' }, 'waiting');
        pills.set(row.pkg, pill);
        return el('div', { class: 'row told' }, cell(row), pill);
      })),
    });
    for (const pkg of packages) state.pending.add(pkg);
    const [result] = await Promise.all([
      api('/api/act', { method: 'POST', body: { action: 'remove', packages, serial: state.serial } }),
      sleep(still() ? 0 : 600),
    ]);
    for (const pkg of packages) state.pending.delete(pkg);
    log(`Clean up ${plural(packages.length, 'app', 'apps')}`, result.output || result.error);
    const how = Words.outcomes(result.output, packages);
    const gone = packages.filter(pkg => how.has(pkg) && how.get(pkg).done);
    if (gone.length) state.needsRestart = true;
    bar.classList.add('done');
    const tell = pkg => { if (pills.has(pkg)) pills.get(pkg).replaceWith(outcomeChip(how, pkg)); };
    // The phone has answered. Now the lightning, and only for what went.
    await magic.zapTiles(gone, gone.length > 12 ? 90 : 170, tell);
    for (const pkg of packages) {
      if (gone.includes(pkg)) continue;
      magic.tile(pkg, 'fail');
      tell(pkg);
    }
    await scan({ quiet: true });
    wiz.busy = false;
    return wizDone(result, chosen, how, cell);
  }

  function wizDone(result, chosen, how, cell) {
    const done = row => how.has(row.pkg) && how.get(row.pkg).done;
    const word = row => (how.has(row.pkg) ? how.get(row.pkg).said : '');
    const gone = chosen.filter(done);
    const stuck = chosen.filter(row => !done(row));
    const taken = gone.filter(row => /^(removed|uninstalled)$/.test(word(row))).length;
    const fellBack = gone.length - taken;
    const undo = gone.filter(row => !row.app).map(row => row.pkg);
    const final = gone.length - undo.length;
    const left = state.status === 'ready' ? cleanup().length : 0;
    const told = el('div', {}, chosen.map(row => el('div', { class: 'row told' }, cell(row), outcomeChip(how, row.pkg))));
    const close = primary => el('button', { class: `btn${primary ? ' primary' : ''}`, onclick: closeWizard }, 'Close');
    const asks = state.status === 'ready' ? state.scan.lists.ask.filter(row => !row.locked).length : 0;
    const report = `MAXAPACITY Debloat ${VERSION}\n${result.output || ''}`.trim();
    const noteLine = (tone, iconName, text) => el('li', { class: tone }, icon(iconName), el('span', {}, text));

    if (!gone.length) {
      magic.act('idle');
      magic.act('shrug');
      return wizShow({
        step: 'done',
        line: result.ok ? 'They would not budge.' : 'That did not work.',
        sub: result.ok ? 'The phone\'s maker has locked what is listed below. Nothing about it was changed.' : result.error,
        body: result.ok ? told : null,
        buttons: [el('button', { class: 'btn', onclick: wizScan }, icon('refresh'), 'Scan again'), close(true)],
      });
    }
    magic.phone(left ? 'idle' : 'clean', ...junkOf(left ? cleanup() : []));
    magic.shades(true);
    magic.act('cool');
    magic.act('cheer');
    magic.celebrate();
    // The headline counts what is out of the way; a line each for what that
    // means, in the colour the answers below are in.
    return wizShow({
      step: 'done',
      line: stuck.length ? `${gone.length} of ${chosen.length} are out of the way.`
        : gone.length === 1 ? 'It is out of the way.' : `All ${gone.length} are out of the way.`,
      notes: el('ul', { class: 'wiz-notes' },
        taken ? noteLine('ok', 'check', `${taken} removed.`) : null,
        fellBack ? noteLine('warn', 'alert', `Android would not remove ${fellBack}, so ${fellBack === 1 ? 'it is' : 'they are'} switched off or silenced instead. That stops ${fellBack === 1 ? 'it' : 'them'} just the same.`) : null,
        stuck.length ? noteLine('bad', 'lock', `${stuck.length} ${stuck.length === 1 ? 'is' : 'are'} locked by the phone's maker. Nothing about ${stuck.length === 1 ? 'it' : 'them'} was changed.`) : null,
        final && undo.length ? noteLine('', 'info', `Undo brings back the ${undo.length} that came with the phone. The ${final} uninstalled ${final === 1 ? 'app' : 'apps'} cannot come back.`) : null,
        noteLine('', 'power', 'Restart the phone when you are done, so its lock and home screens catch up.'),
        el('li', {}, el('span', {}), el('button', { class: 'btn quiet small', onclick: event => copy(report, event.currentTarget) }, icon('copy', 16), 'Copy what was done'))),
      body: told,
      note: undo.length ? el('button', { class: 'btn', onclick: () => wizUndo(undo) }, icon('undo'), `Undo ${undo.length}`) : '',
      // What is left to decide comes before the restart, which takes the
      // phone away for a minute.
      buttons: asks
        ? [el('button', { class: 'btn', onclick: wizRestart }, icon('power'), 'Restart phone'),
          el('button', { class: 'btn primary', onclick: wizDeck }, icon('layers'), `Go through ${asks} more`)]
        : [close(false), el('button', { class: 'btn primary', onclick: wizRestart }, icon('power'), 'Restart phone')],
    });
  }

  async function wizUndo(packages) {
    if (wiz.busy) return undefined;
    wiz.busy = true;
    magic.shades(false);
    magic.act('channel');
    wizShow({
      step: 'done',
      line: packages.length === 1 ? 'Putting it back.' : 'Putting them back.',
      sub: `Restoring ${plural(packages.length, 'app', 'apps')} to the phone.`,
      body: el('div', {}, el('div', { class: 'working', role: 'progressbar', 'aria-label': 'Waiting for the phone' }, el('i'))),
    });
    const result = await api('/api/act', { method: 'POST', body: { action: 'restore', packages, serial: state.serial } });
    log(`Restore ${plural(packages.length, 'app', 'apps')}`, result.output || result.error);
    await scan({ quiet: true });
    wiz.busy = false;
    if (state.status !== 'ready') return wizConnect();
    wiz.items = cleanup();
    wiz.picked = new Set(wiz.items.map(row => row.pkg));
    return wizFound();
  }

  async function wizRestart() {
    if (wiz.busy) return undefined;
    wiz.busy = true;
    magic.tiles([]);
    magic.phone('none');
    magic.act('search');
    wizShow({
      step: 'done',
      line: 'Restarting the phone.',
      sub: 'It drops off USB for about a minute. I will know when it is back.',
      body: el('div', {}, el('div', { class: 'working', role: 'progressbar', 'aria-label': 'Waiting for the phone' }, el('i'))),
    });
    const result = await api(`/api/restart${query()}`, { method: 'POST' });
    log('Restart the phone', result.output || result.error);
    if (!result.ok) {
      wiz.busy = false;
      magic.act('idle');
      magic.act('shrug');
      return wizShow({
        step: 'done',
        line: 'It would not restart.',
        sub: result.error,
        buttons: [el('button', { class: 'btn primary', onclick: closeWizard }, 'Close')],
      });
    }
    state.needsRestart = false;
    await comeBack();
    await scan({ quiet: true });
    wiz.busy = false;
    if (state.status !== 'ready') return wizConnect();
    const left = cleanup().length;
    const asks = state.scan.lists.ask.filter(row => !row.locked).length;
    magic.phone(left ? 'idle' : 'clean', ...junkOf(cleanup()));
    magic.tiles(cleanup().map(tileOf));
    magic.shades(true);
    magic.act('cool');
    return wizShow({
      step: 'done',
      line: 'Back, and quieter than it was.',
      sub: left
        ? `${plural(left, 'thing is', 'things are')} still on it that could go. Scan again after a system update too: updates can bring things back.`
        : 'Scan again after a system update: updates can switch back on what was removed.',
      buttons: asks
        ? [el('button', { class: 'btn', onclick: closeWizard }, 'Close'),
          el('button', { class: 'btn primary', onclick: wizDeck }, icon('layers'), `Go through ${asks} more`)]
        : [el('button', { class: 'btn primary', onclick: closeWizard }, 'Close')],
    });
  }

  // ---- One app, in full ----------------------------------------------------

  // Which list says most about an app, when it is in several.
  const ORDER = ['back', 'remove', 'ask', 'pushed', 'off', 'keep', 'unknown', 'other', 'notifying'];

  function openDetail(pkg) {
    state.detail = pkg;
    renderDetail();
    syncMagic();
  }
  function closeDetail() {
    if (!state.detail) return;
    state.detail = '';
    renderDetail();
    syncMagic();
  }

  // Everything the scan knows about one app, beside the list it came from:
  // what it is, what removing it means, how it got here, and the buttons
  // to act on it alone.
  function renderDetail() {
    const panel = document.getElementById('detail');
    const pkg = state.detail;
    const lists = state.scan && state.status === 'ready' && !wiz.open ? state.scan.lists : null;
    const where = lists && pkg ? ORDER.filter(name => lists[name].some(row => row.pkg === pkg)) : [];
    for (const node of document.querySelectorAll('.row[data-pkg]')) node.classList.toggle('open', where.length > 0 && node.dataset.pkg === pkg);
    document.body.classList.toggle('has-detail', where.length > 0);
    if (!where.length) {
      state.detail = '';
      panel.hidden = true;
      panel.replaceChildren();
      return;
    }
    const find = name => lists[name].find(row => row.pkg === pkg);
    const row = find(where[0]);
    const said = describe(row, where[0]);
    const off = where.includes('off');
    const kept = where.includes('keep') || row.locked;
    const ruled = ['remove', 'ask', 'keep'].find(name => where.includes(name));
    const listed = ruled ? Words.community(find(ruled).note)
      : where.includes('unknown') ? Words.community(find('unknown').note.split('; ').slice(1).join('; ')) : null;
    const reason = Words.parts(Words.plain(said.title, known().get(pkg) || ''));
    // A rule that only names the app says nothing the name does not: then
    // it is where the app came from that is known.
    const what = reason.what && reason.what.toLowerCase() !== said.title.toLowerCase() ? reason.what
      : listed ? listed.text : ruled ? said.about : '';
    const busy = state.pending.size > 0;

    const facts = [];
    if (where.includes('back')) facts.push('Removed earlier, and back again.');
    for (const name of ['pushed', 'other']) if (where.includes(name)) facts.push(`${describe(find(name), name).about}.`);
    if (where.includes('notifying')) {
      const up = parseInt(find('notifying').note, 10) || 0;
      facts.push(`${plural(up, 'notification', 'notifications')} showing when the phone was last scanned.`);
    }
    if (where.includes('unknown') && !listed) {
      const place = describe(find('unknown'), 'unknown').about;
      if (place) facts.push(`${place}.`);
    }
    const last = state.scan.changes.filter(change => change.pkg === pkg).pop();
    if (off && !last) {
      // Out of the way, and not by this app: say how it is.
      const how = Words.offParts(find('off').note);
      facts.push(`${how.state.replace(/^./, c => c.toUpperCase())} by something other than this app.`);
    }
    if (last) facts.push(`${(DID[last.action] || last.action).replace(/^./, c => c.toUpperCase())} by this app${ago(last.when) ? `, ${ago(last.when)}` : ''}.`);
    // Which pages it is on, said as a sentence: a chip with a page's name
    // on it reads as a button.
    facts.push(`Listed under ${listOf(where.map(name => VIEWS[name].label))}.`);

    const consequence = kept ? 'The phone needs this one to work. Nothing here will touch it.'
      : off ? 'It is out of the way now. Restore puts it back as it was.'
        : row.app ? 'It was added to the phone after it was made, so removing it uninstalls it for good, along with whatever is saved in it. The Play Store is the only way back.'
          : 'It came with the phone, so removing it can be undone: Already off brings it back whenever you like. Where Android will not remove it, it is switched off instead, which stops it just the same.';

    const one = async (action, final) => {
      if (final && !(await forGood([pkg]))) return;
      act(action, [pkg], action === 'restore' ? { undo: [] } : undefined);
    };
    const buttons = kept ? null
      : off ? el('div', { class: 'pair' }, el('button', { class: 'btn primary', disabled: busy, onclick: () => one('restore') }, icon('restore'), 'Restore'))
        : row.app ? el('div', { class: 'pair' }, el('button', { class: 'btn primary', disabled: busy, onclick: () => one('uninstall', true) }, icon('trash'), 'Uninstall'))
          : [el('div', { class: 'pair' },
            el('button', { class: 'btn primary', disabled: busy, onclick: () => one('remove') }, icon('trash'), 'Remove'),
            el('button', { class: 'btn', disabled: busy, onclick: () => one('mute') }, icon('mute'), 'Silence')),
          el('p', {}, 'Silence leaves the app where it is, and stops its notifications and anything it does in the background.')];

    panel.hidden = false;
    set(panel,
      el('div', { class: 'detail-head' },
        appMark(pkg, said.about),
        el('div', {}, el('h2', {}, said.title), pkgNode(pkg)),
        el('button', { class: 'btn quiet small', 'aria-label': 'Close', title: 'Close', onclick: closeDetail }, icon('x'))),
      el('div', { class: 'detail-body' },
        reinstalls(pkg) || row.app || (kept && !off) ? el('div', { class: 'chips' },
          reinstalls(pkg) ? el('span', { class: 'chip bad' }, 'puts apps back') : null,
          row.app ? el('span', { class: 'chip' }, 'added later') : null,
          kept && !off ? el('span', { class: 'chip' }, 'phone needs it') : null) : null,
        el('section', {},
          el('h3', {}, 'What it is'),
          el('p', { class: 'plain' }, what || 'Nobody has described this app, and the phone does not say what it is.'),
          reason.catch ? el('p', {}, reason.catch, '.') : null,
          what && listed ? el('p', { class: 'check-detail' }, `From the community list, which rates removing it "${listed.rating}".`) : null),
        el('section', {},
          el('h3', {}, off ? 'If you bring it back' : 'If you remove it'),
          el('p', {}, consequence),
          reinstalls(pkg) ? el('p', {}, 'It can put apps on the phone by itself. Remove it before the apps it installed, or they come back.') : null),
        el('section', {}, el('h3', {}, 'On this phone'), el('ul', { class: 'facts' }, facts.map(fact => el('li', {}, fact)))),
        el('section', {},
          el('h3', {}, 'Its name'),
          el('p', {}, 'The phone only gives this app\'s package name, shown under the name above. The name is a reading of it, so the phone may call the app something else.'),
          el('div', { class: 'detail-links' },
            el('button', { class: 'btn quiet small', onclick: event => copy(pkg, event.currentTarget) }, icon('copy', 16), 'Copy package name'),
            el('a', {
              class: 'btn quiet small', target: '_blank', rel: 'noopener noreferrer',
              href: `https://www.google.com/search?q=${encodeURIComponent(`"${pkg}" android`)}`,
            }, icon('external', 16), 'Look it up on the web')))),
      el('div', { class: 'detail-foot' }, buttons));
  }

  // ---- Find anything -------------------------------------------------------

  // The wizard's robe: graphite by default, and the violet he first wore
  // for those who miss it.
  let robe = 'graphite';
  try {
    robe = localStorage.getItem('debloat-robe') === 'violet' ? 'violet' : 'graphite';
  } catch (e) { /* graphite, then */ }
  function setRobe(name) {
    robe = name;
    if (engine) engine.set({ look: name });
    try {
      localStorage.setItem('debloat-robe', name);
    } catch (e) { /* not remembered, then */ }
  }

  // Everything there is to do, everywhere there is to go, and every app the
  // last scan found. What matters most comes first; "extra" things to do
  // wait until something is typed, and the wizard's wardrobe comes last.
  function commands() {
    const out = [];
    const add = (group, label, hint, iconName, run, extra = false) => out.push({
      group, label, hint: hint || '', icon: iconName, run, extra, search: `${label} ${hint || ''}`.toLowerCase(),
    });
    const ready = state.status === 'ready';
    if (ready) {
      const n = cleanup().length;
      const asks = state.scan.lists.ask.filter(row => !row.locked).length;
      if (n && magic) add('Do', 'Clean up with the wizard', `${n} can go`, 'wand', () => openWizard());
      if (n) add('Do', 'Review the cleanup as a list', `${n} can go`, 'review', review);
      if (asks) add('Do', 'Go through Ask first one at a time', plural(asks, 'app', 'apps'), 'layers', () => openDeck());
    }
    add('Do', ready ? 'Scan again' : 'Look for the phone again', '', 'refresh', () => scan());
    if (ready) {
      const listed = Number(state.scan.meta.community) || 0;
      add('Do', 'Restart the phone', '', 'power', restart);
      add('Do', listed ? 'Stop using the community list' : 'Get the community list',
        listed ? `${listed} apps described` : 'says what most apps are', 'users', () => community(!listed), true);
      add('Do', 'See what is on the phone\'s screen', '', 'eye', () => { go('activity'); inspect(); }, true);
      add('Do', state.watch ? 'Stop watching for installs' : 'Watch for installs', '', 'radio', () => { go('activity'); toggleWatch(); }, true);
    }
    for (const group of NAV) {
      for (const id of group.items) {
        add('Go to', VIEWS[id].label, ready && state.scan.lists[id] ? String(state.scan.lists[id].length) : '', VIEWS[id].icon, () => go(id));
      }
    }
    if (engine) {
      add('The wizard', magic ? 'Send the wizard away' : 'Bring the wizard back', '', 'wand', toggleWizard);
      if (magic) add('The wizard', robe === 'violet' ? 'Dress him in graphite' : 'Dress him in his old violet', '', 'wand', () => setRobe(robe === 'violet' ? 'graphite' : 'violet'));
    }
    if (ready) {
      const seen = new Set();
      for (const name of ORDER) {
        for (const row of state.scan.lists[name]) {
          if (seen.has(row.pkg)) continue;
          seen.add(row.pkg);
          const title = nameOf(row.pkg);
          const about = describe(row, name).about;
          out.push({
            group: 'Apps', label: title, hint: `${VIEWS[name].label} · ${row.pkg}`, about, pkg: row.pkg,
            run: () => { go(name); openDetail(row.pkg); },
            search: `${title} ${row.pkg} ${about} ${VIEWS[name].label}`.toLowerCase(),
          });
        }
      }
    }
    return out;
  }

  // One box for all of it: Cmd-K, or the box under the name.
  function openPalette() {
    const dialog = document.getElementById('palette');
    if (wiz.open || dialog.open || document.getElementById('dialog').open) return;
    const all = commands();
    const input = el('input', {
      type: 'text', placeholder: 'Find an app, a page, or something to do', 'aria-label': 'Find anything',
      autocomplete: 'off', spellcheck: 'false', role: 'combobox', 'aria-expanded': 'true', 'aria-controls': 'palette-list',
    });
    const list = el('div', { class: 'palette-list', id: 'palette-list', role: 'listbox' });
    let shown = [];
    let at = 0;
    const pick = i => {
      const item = shown[i];
      if (!item) return;
      dialog.close();
      item.run();
    };
    const mark = () => {
      list.querySelectorAll('.palette-item').forEach((node, i) => {
        node.classList.toggle('on', i === at);
        node.setAttribute('aria-selected', String(i === at));
        if (i === at) node.scrollIntoView({ block: 'nearest' });
      });
    };
    const draw = () => {
      const need = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      let apps = 0;
      // Apps, and the less usual things to do, only once something is typed,
      // and never a screenful of apps. A name that matches comes before a
      // description that happens to.
      const near = item => (need.every(word => item.label.toLowerCase().includes(word)) ? 0 : 1);
      shown = all.filter(item => need.every(word => item.search.includes(word)))
        .filter(item => need.length > 0 || !item.extra)
        .map((item, i) => ({ item, i }))
        .sort((a, b) => (a.item.group === b.item.group ? near(a.item) - near(b.item) || a.i - b.i : a.i - b.i))
        .map(entry => entry.item)
        .filter(item => item.group !== 'Apps' || (need.length > 0 && ++apps <= 12));
      at = 0;
      if (!shown.length) {
        set(list, el('div', { class: 'palette-empty' }, 'Nothing by that name. Part of a package name works too.'));
        return;
      }
      let group = '';
      set(list, shown.map((item, i) => {
        const head = item.group !== group ? el('div', { class: 'palette-group' }, item.group) : null;
        group = item.group;
        // What is beside an app is where it was found: under its name or its
        // package as a rule, and otherwise the words that matched.
        const named = !item.pkg || need.every(word => `${item.label} ${item.hint}`.toLowerCase().includes(word));
        return [head, el('div', {
          class: `palette-item${i === at ? ' on' : ''}`, role: 'option', 'aria-selected': String(i === at),
          onclick: () => pick(i),
          onpointermove: () => { if (at !== i) { at = i; mark(); } },
        }, item.pkg ? appGlyph(item.pkg, item.about) : icon(item.icon), el('span', { class: 'label' }, item.label),
        el('span', { class: 'hint' }, named ? item.hint : item.about))];
      }));
    };
    input.addEventListener('input', draw);
    input.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (!shown.length) return;
        at = (at + (event.key === 'ArrowDown' ? 1 : shown.length - 1)) % shown.length;
        mark();
      } else if (event.key === 'Enter') {
        event.preventDefault();
        pick(at);
      }
    });
    set(dialog,
      el('div', { class: 'palette-field' }, icon('search', 24), input, el('kbd', {}, 'esc')),
      list,
      el('div', { class: 'palette-foot' },
        el('span', {}, el('kbd', {}, '↑'), el('kbd', {}, '↓'), 'to move'),
        el('span', {}, el('kbd', {}, '↵'), 'to choose')));
    draw();
    dialog.showModal();
    input.focus();
  }

  // ---- One at a time -------------------------------------------------------

  // The apps with a catch, one to a card: what it is, the catch, what
  // removing it does, and two keys, keep or remove. Keep is the one in
  // reach: it is the answer that cannot go wrong. Nothing happens until the
  // last card is past and the tally agreed. `host` is where the cards are
  // drawn; `done` gets the ones marked for removal, `show` hears which card
  // is up, and `exit` adds a Cancel where there is no other way out.
  function deck(rows, host, { done, cancel, show = () => {}, exit = false }) {
    const choice = new Map();
    let at = 0;
    const count = what => [...choice.values()].filter(value => value === what).length;
    const catchOf = row => {
      const listed = Words.community(row.note);
      return listed ? { what: listed.text, catch: '' } : Words.parts(Words.plain(nameOf(row.pkg), row.note));
    };
    const back = () => {
      at -= 1;
      draw();
    };
    const answer = what => {
      if (at >= rows.length) return;
      choice.set(rows[at].pkg, what);
      at += 1;
      draw();
    };
    // A long run of cards can be cut short: what is left is kept.
    const rest = () => {
      for (let i = at; i < rows.length; i++) choice.set(rows[i].pkg, 'keep');
      at = rows.length;
      draw();
    };
    const leave = exit ? el('button', { class: 'btn quiet', onclick: cancel }, 'Cancel') : null;
    const tally = () => {
      const going = rows.filter(row => choice.get(row.pkg) === 'remove');
      const final = going.filter(row => row.app).length;
      show(null, choice);
      set(host, el('div', { class: 'deck' },
        el('div', { class: 'deck-count' }, el('span', {}, 'All answered'), el('span', {}, counted(going.length, 'to remove, '), counted(rows.length - going.length, 'to keep'))),
        el('div', { class: 'deck-bar' }, el('i', { style: 'width:100%' })),
        el('div', { class: 'deck-card' }, el('div', { class: 'deck-sum' },
          el('div', { class: 'app-name' }, going.length ? `Remove ${going.length}, keep ${rows.length - going.length}.` : 'Keep them all.'),
          // What goes, each with the catch it was shown with.
          going.length ? el('ul', {}, going.map(row => {
            const said = catchOf(row);
            return el('li', {}, el('b', {}, nameOf(row.pkg)),
              el('span', {}, row.app ? el('span', { class: 'gone' }, 'Uninstalled for good, with whatever is saved in it.') : said.catch || said.what));
          })) : el('p', {}, 'Nothing on the phone changes.'))),
        el('div', { class: 'deck-keys' },
          el('button', { class: 'btn', onclick: back }, icon('back'), 'Back'),
          leave,
          el('span', { class: 'grow' }, final ? '' : going.length ? 'These can be brought back from Already off.' : ''),
          going.length ? el('button', { class: 'btn primary answer', onclick: () => done(going) }, icon('trash'), `Remove ${going.length}`)
            : el('button', { class: 'btn primary answer', onclick: cancel }, 'Done'))));
      const first = host.querySelector('.btn.primary');
      if (first) first.focus({ preventScroll: true });
    };
    function draw() {
      if (at >= rows.length) return tally();
      const row = rows[at];
      const said = describe(row, 'ask');
      const { what, catch: snag } = catchOf(row);
      show(row, choice);
      set(host, el('div', { class: 'deck' },
        el('div', { class: 'deck-count' }, el('span', {}, counted(at + 1, `of ${rows.length}`)), el('span', {}, counted(count('remove'), 'to remove, '), counted(count('keep'), 'to keep'))),
        el('div', { class: 'deck-bar' }, el('i', { style: `width:${(at / rows.length) * 100}%` })),
        el('div', { class: 'deck-card' },
          appCell(row.pkg, said.title, said.about, true),
          el('div', {}, el('h3', {}, Words.community(row.note) ? 'What the community list says' : 'What it is'),
            el('p', {}, what || said.about)),
          snag ? el('div', {}, el('h3', {}, 'The catch'), el('div', { class: 'catch' }, icon('alert'), el('p', {}, snag, '.'))) : null,
          el('div', {}, el('h3', {}, 'If you remove it'), el('p', { class: row.app ? 'gone' : 'after' }, row.app
            ? 'It is uninstalled for good, with whatever is saved in it. The Play Store is the only way back.'
            : 'It can be brought back from Already off whenever you like.'))),
        el('div', { class: 'deck-keys' },
          at > 0 ? el('button', { class: 'btn', onclick: back }, icon('back'), 'Back') : null,
          rows.length - at > 3 ? el('button', { class: 'btn quiet', onclick: rest }, 'Keep the rest') : null,
          leave,
          el('span', { class: 'grow' }, 'Not sure? Keep it.'),
          el('button', { class: 'btn answer keep', onclick: () => answer('keep') }, icon('shield'), 'Keep', el('kbd', {}, 'K')),
          el('button', { class: 'btn answer', onclick: () => answer('remove') }, icon('trash'), 'Remove', el('kbd', {}, 'R')))));
      // Keep is where the keyboard starts on every card, so that Return or
      // the space bar can only ever do the safe thing.
      const safe = host.querySelector('.answer.keep');
      if (safe) safe.focus({ preventScroll: true });
      return undefined;
    }
    // K and R answer, the arrows too, and Backspace goes back. The listener
    // goes when the cards do.
    const keys = event => {
      if (!host.isConnected) {
        document.removeEventListener('keydown', keys);
        return;
      }
      if (event.metaKey || event.ctrlKey || event.altKey || at >= rows.length) return;
      const key = event.key.toLowerCase();
      if (key === 'k' || key === 'arrowleft') answer('keep');
      else if (key === 'r' || key === 'arrowright') answer('remove');
      else if (key === 'backspace' && at > 0) back();
      else return;
      event.preventDefault();
    };
    document.addEventListener('keydown', keys);
    draw();
  }

  // With the wizard out, the cards are on his screen. Without him, a dialog.
  function openDeck() {
    if (state.status !== 'ready') return;
    const rows = state.scan.lists.ask.filter(row => !row.locked);
    if (!rows.length) return;
    if (magic) {
      openWizard({ deck: true });
      return;
    }
    const dialog = document.getElementById('dialog');
    const host = el('div', {});
    dialog.classList.add('wide');
    set(dialog,
      el('div', { class: 'dialog-head' },
        el('h2', {}, 'One at a time'),
        el('p', {}, 'Each of these comes with a catch. Keep it or remove it; nothing changes until the end.')),
      host);
    dialog.oncancel = null;
    deck(rows, host, {
      exit: true,
      cancel: () => dialog.close(),
      done: going => {
        dialog.close();
        act('remove', going.map(row => row.pkg));
      },
    });
    dialog.showModal();
  }

  // ---- A word from the wizard ----------------------------------------------

  // On each page the wizard has one thing to say, if there is one worth
  // saying, and the button that does it. Said once: closing it is heard.
  // He holds his tongue while anything is ticked: the buttons for that are
  // already up.
  const told = new Set();
  function tipFor(view) {
    const lists = state.scan.lists;
    const n = lists[view] ? lists[view].length : 0;
    const active = (state.scan.installers || []).some(item => item.active);
    if (!n && view !== 'notifying') return null;
    if (view === 'remove') return { text: `I can clear ${n === 1 ? 'this' : `all ${n} of these`}, and the rest of the junk, in one go.`, label: 'Clean up with the wizard', run: () => openWizard() };
    if (view === 'ask') return { text: 'Each of these comes with a catch. I can show you them one at a time.', label: 'One at a time', run: () => openDeck() };
    if (view === 'pushed') {
      return active ? { text: 'An installer put these here, and it is still on the phone. It goes first, or they come back.', label: 'Clean up with the wizard', run: () => openWizard() }
        : { text: 'An installer put these here. Uninstalling one deletes whatever is saved in it.' };
    }
    if (view === 'back') return { text: 'Back again. Whatever puts them back is still at work: look under Remove.', label: 'Go to Remove', run: () => go('remove') };
    if (view === 'notifying') return { text: 'Bring the nuisance up on the phone\'s screen, then scan again. I will name the app behind it.', label: 'Scan again', run: () => scan() };
    if (view === 'unknown') {
      return Number(state.scan.meta.community) ? null
        : { text: 'I do not know these. The community list describes most apps on most phones.', label: 'Get the list', run: () => community(true) };
    }
    if (view === 'off') return { text: 'Anything here can come back: tick it, then Restore.' };
    if (view === 'keep') return { text: 'The phone needs these. I leave them be.' };
    return null;
  }
  function renderTip() {
    const node = tipNode;
    const shown = palNode.isConnected && state.status === 'ready' && !told.has(state.view) && !state.selected.size;
    const tip = shown ? tipFor(state.view) : null;
    node.hidden = !tip;
    document.body.classList.toggle('has-tip', Boolean(tip));
    if (!tip) return;
    const heard = () => {
      told.add(state.view);
      renderTip();
    };
    set(node,
      el('p', {}, tip.text),
      el('button', { class: 'btn quiet small x', 'aria-label': 'Close', title: 'Close', onclick: heard }, icon('x', 16)),
      tip.label ? el('button', { class: 'btn small do', onclick: () => { heard(); tip.run(); } }, tip.label) : null);
  }

  // ---- Activity ------------------------------------------------------------

  function activityView() {
    const head = el('header', { class: 'page-head' }, el('div', {},
      el('h1', {}, 'Activity'),
      el('p', { class: 'blurb' }, 'Everything this app has asked the phone to do, with the phone\'s own answers. Two more things it can do from here: say which app is drawing on the screen right now, and watch for apps being installed.')),
    says());
    const can = state.status === 'ready';
    const see = primary => el('button', { class: primary ? 'btn primary' : 'btn', onclick: inspect, disabled: !can }, icon('eye'), 'What is on screen');
    const watch = () => el('button', { class: 'btn', onclick: toggleWatch, disabled: !can && !state.watch },
      icon('radio'), state.watch ? 'Stop watching' : 'Watch for installs');

    // With nothing in the log yet, the two buttons are the page.
    if (state.log.length === 0) {
      return [head, el('section', { class: 'card' }, el('div', { class: 'state' },
        icon('activity', 40),
        el('strong', {}, 'Nothing has run yet.'),
        el('p', {}, 'Something on the lock screen that should not be there? Bring it up on the phone, then ask what is on screen.'),
        el('div', { class: 'hero-actions' }, see(true), watch())))];
    }
    return [head, el('section', { class: 'card' },
      el('div', { class: 'toolbar' }, see(false), watch(), el('div', { class: 'grow' })),
      el('div', {}, state.log.map(entry => el('article', { class: 'entry' },
        el('div', { class: 'entry-head' },
          el('time', { class: 'mono' }, entry.time),
          el('b', {}, entry.title),
          entry.live ? el('span', { class: 'live' }, 'live') : null),
        entry.body ? el('pre', {}, entry.body.trim()) : null))))];
  }

  // ---- Toast and dialog ----------------------------------------------------

  // What just happened, and the way back where there is one. It stays long
  // enough to be read and reached without hurrying, and can be closed.
  let toastTimer = 0;
  function toast(text, { tone = '', undo = null } = {}) {
    const node = document.getElementById('toast');
    clearTimeout(toastTimer);
    const close = () => {
      node.classList.remove('show');
      document.body.classList.remove('has-toast');
    };
    node.className = `toast show ${tone}`;
    document.body.classList.add('has-toast');
    set(node,
      el('span', {}, text),
      undo ? el('button', { class: 'btn small', onclick: () => { close(); undo(); } }, icon('undo', 16), 'Undo') : null,
      el('button', { class: 'btn quiet small x', 'aria-label': 'Close', title: 'Close', onclick: close }, icon('x', 16)));
    toastTimer = setTimeout(close, undo ? 20000 : 8000);
  }

  // A question with two answers. Asked from inside a dialog that is already
  // open, it takes that dialog's place and leaves it open afterwards, for
  // whoever asked to put back what was there.
  function ask({ title, text, yes }) {
    const dialog = document.getElementById('dialog');
    const nested = dialog.open;
    dialog.classList.remove('wide');
    return new Promise(resolve => {
      const done = answer => {
        if (!nested) dialog.close();
        resolve(answer);
      };
      set(dialog,
        el('div', { class: 'dialog-head' }, el('h2', {}, title), el('p', {}, text)),
        el('div', { class: 'dialog-foot' }, el('div', { class: 'grow' }),
          el('div', { class: 'acts' },
            el('button', { class: 'btn', onclick: () => done(false) }, 'Cancel'),
            el('button', { class: 'btn primary', onclick: () => done(true) }, yes))));
      // Escape says no. Asked from inside another dialog, it must not shut
      // that one as well.
      dialog.oncancel = event => {
        if (nested) event.preventDefault();
        done(false);
      };
      if (!nested) dialog.showModal();
      // Cancel is where the keyboard starts: Return must not agree to
      // something by accident.
      dialog.querySelector('.dialog-foot .btn').focus({ preventScroll: true });
    });
  }

  // A closed dialog keeps nothing behind: no stale rows for a screen reader or
  // a search of the page to find.
  document.getElementById('dialog').addEventListener('close', event => {
    event.target.classList.remove('wide');
    event.target.replaceChildren();
  });

  document.getElementById('palette').addEventListener('close', event => event.target.replaceChildren());

  // "/" jumps to the filter; Escape drops the selection.
  document.addEventListener('keydown', event => {
    if (wiz.open) {
      // His screen has the keys while it is up; Escape leaves it.
      if (event.key === 'Escape' && !document.getElementById('dialog').open) closeWizard();
      return;
    }
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      openPalette();
      return;
    }
    const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    const modal = document.getElementById('dialog').open || document.getElementById('palette').open;
    if (state.detail && !modal && !inField) {
      // With an app's details open: Escape closes them, and the arrows
      // move to the app above or below in the list.
      if (event.key === 'Escape') {
        closeDetail();
        return;
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        const shown = visibleRows();
        const at = shown.findIndex(row => row.pkg === state.detail);
        const next = shown[at + (event.key === 'ArrowDown' ? 1 : -1)];
        if (next) {
          event.preventDefault();
          openDetail(next.pkg);
          const node = document.querySelector('.row.open');
          if (node) node.scrollIntoView({ block: 'nearest' });
        }
        return;
      }
    }
    if (event.key === '/' && !inField && ui.search && ui.search.isConnected) {
      event.preventDefault();
      ui.search.focus();
    } else if (event.key === 'Escape' && state.selected.size && !document.getElementById('dialog').open) {
      state.selected.clear();
      paint();
    }
  });

  // The wizard is out unless he was sent away last time.
  let wanted = true;
  try {
    wanted = localStorage.getItem('debloat-magic') !== 'off';
  } catch (e) { /* nothing remembered: he is out */ }
  setMagic(Boolean(engine) && wanted, false);
  if (engine) engine.set({ look: robe });
  wizBack.addEventListener('click', () => { if (magic) magic.poke(); });
  addEventListener('resize', aim);
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', event => { if (engine) engine.set({ light: event.matches }); });
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', event => { if (engine) engine.set({ still: event.matches }); });

  // Cards on the overview lean towards the pointer.
  const mainNode = document.querySelector('main');
  mainNode.addEventListener('pointermove', event => {
    const card = event.target.closest ? event.target.closest('.tile') : null;
    if (!card || !magic || still()) return;
    const box = card.getBoundingClientRect();
    card.style.setProperty('--ry', `${(((event.clientX - box.left) / box.width - 0.5) * 5).toFixed(2)}deg`);
    card.style.setProperty('--rx', `${(((event.clientY - box.top) / box.height - 0.5) * -5).toFixed(2)}deg`);
  });
  mainNode.addEventListener('pointerout', event => {
    const card = event.target.closest ? event.target.closest('.tile') : null;
    if (!card || card.contains(event.relatedTarget)) return;
    card.style.removeProperty('--rx');
    card.style.removeProperty('--ry');
  });

  render();
  scan();
  oneWindow();
  hold();
  // A second line to the helper, should anything cut the held request short.
  setInterval(() => { api('/api/alive'); }, 5000);
})();
</script>
</body>
</html>
